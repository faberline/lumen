# Use the consumer's real test workflow names and an immutable reviewed AW ref.
# Bind this workflow ID, Git blob, report and link_job in development_reporter.
name: Development CI label handoff
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [aw-development-reconcile]
  workflow_run:
    workflows: ["Lumen development CI"]
    types: [requested, in_progress, completed]
  issues:
    types: [edited, reopened, closed, labeled, unlabeled]
permissions: {}
concurrency:
  group: issue-ci-handoff
  cancel-in-progress: false
jobs:
  source-pr-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: faberline/aw/.github/actions/issue-ci@4223a4534f0197e1ea23004b9388ffd1eea34639
        with:
          operation: development-report
  report:
    needs: source-pr-links
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: faberline/aw/.github/actions/issue-ci@4223a4534f0197e1ea23004b9388ffd1eea34639
        with:
          operation: development-report

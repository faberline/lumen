name: Lumen development CI
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: lumen-development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  development-preflight:
    name: development preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      head: ${{ steps.preflight.outputs.head }}
      base: ${{ steps.preflight.outputs.base }}
      issue: ${{ steps.preflight.outputs.issue }}
    steps:
      - name: Check main freshness, conflicts and canonical open issue
        id: preflight
        uses: faberline/aw/.github/actions/issue-ci@4223a4534f0197e1ea23004b9388ffd1eea34639
        with:
          operation: development-preflight
          pr: ${{ github.event.pull_request.number }}
          head: ${{ github.event.pull_request.head.sha }}
          base: ${{ github.event.pull_request.base.sha }}

  inventory:
    needs: development-preflight
    name: workspace unit inventory and controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      impact: ${{ steps.impact.outputs.result }}
      contracts: ${{ steps.contracts.outputs.matrix }}
      short_head: ${{ steps.identity.outputs.short_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Prepare isolated hash-locked metadata controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; print(sys.version); sys.exit(0 if sys.version_info >= (3, 11) else "Python 3.11+ required")'
          python3 -m venv "$RUNNER_TEMP/lumen-plan-python"
          "$RUNNER_TEMP/lumen-plan-python/bin/python" -m pip --isolated install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r candidate/scripts/issue-ci/readiness-requirements.txt
          echo "$RUNNER_TEMP/lumen-plan-python/bin" >> "$GITHUB_PATH"
      - name: Run isolated gate controls without skipped tests
        working-directory: candidate
        run: |
          python3 -c 'import sys,unittest; suite=unittest.TestSuite([unittest.defaultTestLoader.discover("scripts/pr-gates/tests"),unittest.defaultTestLoader.discover("scripts/issue-ci/tests",top_level_dir="scripts/issue-ci/tests")]); count=suite.countTestCases(); print("fixture_count="+str(count)); result=unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(0 if count > 0 and result.wasSuccessful() and not result.skipped else 1)'
      - name: Locate pinned shared test planner
        id: shared-library
        uses: faberline/aw/.github/actions/issue-ci@4223a4534f0197e1ea23004b9388ffd1eea34639
        with:
          operation: assertion-library
      - name: Record complete protected test selection without granting qualification
        env:
          AW_ASSERTION_LIBRARY: ${{ steps.shared-library.outputs.assertion-library }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 candidate/scripts/pr-gates/selection.py --root candidate --baseline-root baseline --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE" --output "$RUNNER_TEMP/lumen-test-plan.json"
      - name: Bind the short source identity
        id: identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 -c 'import os,re; head=os.environ["EXPECTED_HEAD"]; assert re.fullmatch("[0-9a-f]{40}",head); print("short_head="+head[:8])' >> "$GITHUB_OUTPUT"

      - name: Inventory every library and binary with manifest feature profiles
        id: plan
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 candidate/scripts/pr-gates/plan.py inventory --root candidate --baseline-root baseline --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE"
          matrix=$(python3 candidate/scripts/pr-gates/batches.py matrix --root candidate --baseline-root baseline --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - name: Record full changed paths and reverse dependency impact
        id: impact
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          impact=$(python3 candidate/scripts/pr-gates/plan.py impact --root candidate --baseline-root baseline --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE")
          printf 'result=%s\n' "$impact" >> "$GITHUB_OUTPUT"
      - name: Inventory every integration target and feature row
        id: contracts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(python3 candidate/scripts/pr-gates/contracts.py matrix --root candidate --baseline-root baseline --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  workspace-format:
    name: workspace formatting
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Check complete workspace formatting
        run: cargo fmt --all -- --check
  workspace-unit-static:
    name: unit-static batch (${{ matrix.batch }})
    needs: inventory
    runs-on: ubuntu-latest
    # Each original package/profile row retains its shared 30-minute limit.
    # This job contains several complete rows instead of one matrix row.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: candidate -> target
          shared-key: pr-unit-batch-${{ matrix.batch }}
          cache-on-failure: true
          cache-workspace-crates: false
      - name: Run every complete row with unit and Clippy; preserve per-case evidence
        env:
          BATCH: ${{ matrix.batch }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          CARGO_INCREMENTAL: "0"
        run: python3 candidate/scripts/pr-gates/batches.py run --root candidate --baseline-root baseline --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE" --batch "$BATCH"
  milestone-docs:
    name: milestone document contracts
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify frozen proposed policy bytes
        run: |
          echo "3631fa4b106144de40ec4d55ff8bc06df09f08d731bd31d2ca15d5c8f2d8c69d  scripts/pr-gates/docs.py" | sha256sum --check
          echo "58ed020068f1c70b8043c23fd4eee1b157c9a70a3e11516eb7811872fca920fb  docs/ci-qualification/milestones.json" | sha256sum --check
      - name: Validate native milestone identities, tracking labels and outcome sections
        run: python3 scripts/pr-gates/docs.py --fixture docs/ci-qualification/milestones.json --fixture-sha256 58ed020068f1c70b8043c23fd4eee1b157c9a70a3e11516eb7811872fca920fb

  image:
    name: build test image
    needs: [inventory, workspace-format, workspace-unit-static, milestone-docs]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/lumen-test-image.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  resolve:
    name: resolve image identity
    needs: [inventory, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.identity.outputs.image }}
      test-env: ${{ steps.identity.outputs.test_env }}
      suites: ${{ steps.identity.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pin the image and its expected identity
        id: identity
        shell: bash
        env:
          RAW_IMAGE: ${{ needs.image.outputs.image }}
          INPUT_VERSION: ""
          INPUT_GIT_SHA: ${{ needs.inventory.outputs.short_head }}
          INPUT_RUNTIME_DIGEST: ""
          # A pull request has no inputs, so it runs all suites.
          INPUT_SUITE: all
        run: |
          set -euo pipefail
          die() { echo "::error::$*" >&2; exit 1; }
          [[ "$RAW_IMAGE" =~ ^ghcr\.io/faberline/lumen(:([A-Za-z0-9_][A-Za-z0-9_.-]{0,127}))?@(sha256:[0-9a-f]{64})$ ]] \
            || die "image must be ghcr.io/faberline/lumen[:tag]@sha256:<64 hex>, got: $RAW_IMAGE"
          tag="${BASH_REMATCH[2]}"
          root_digest="${BASH_REMATCH[3]}"
          image="ghcr.io/faberline/lumen@${root_digest}"

          version="${INPUT_VERSION:-$(grep '^version = ' Cargo.toml | head -n1 | cut -d'"' -f2)}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || die "invalid expected version: $version"

          git_sha="$INPUT_GIT_SHA"
          if [[ -z "$git_sha" && "$tag" =~ ^sha-([0-9a-f]{12})$ ]]; then
            git_sha="${BASH_REMATCH[1]:0:8}"
          fi
          [[ "$git_sha" =~ ^[0-9a-f]{8}$ ]] || die "expected git sha must be 8 lowercase hex (give expected-git-sha or a sha-<git12> tag), got: ${git_sha:-<empty>}"

          runtime_digest="$INPUT_RUNTIME_DIGEST"
          if [[ -z "$runtime_digest" ]]; then
            runtime_digest="$(docker buildx imagetools inspect --raw "$image" | jq -r '
              [.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] |
              if length == 1 then .[0] else empty end')"
          fi
          [[ "$runtime_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || die "no single linux/amd64 child digest for $image"
          [[ "$runtime_digest" != "$root_digest" ]] || die "runtime child digest must differ from the root index digest"

          case "$INPUT_SUITE" in
            all) suites='["overlay","operator"]' ;;
            overlay|operator) suites="[\"${INPUT_SUITE}\"]" ;;
            *) die "suite must be all, overlay, or operator, got: $INPUT_SUITE" ;;
          esac

          # KEY=VALUE lines for aw's gke-test-env ConfigMap. They land in the
          # evidence, so only public identity goes here.
          delim="test_env_$(openssl rand -hex 16)"
          {
            echo "image=${image}"
            echo "suites=${suites}"
            echo "test_env<<${delim}"
            echo "E2E_EXPECTED_IMAGE=${image}"
            echo "E2E_EXPECTED_RUNTIME_DIGEST=${runtime_digest}"
            echo "E2E_EXPECTED_VERSION=${version}"
            echo "E2E_EXPECTED_GIT_SHA=${git_sha}"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### lumen gke-test identity"
            echo
            echo '```text'
            echo "image:          ${image}"
            echo "version:        ${version}"
            echo "git_sha:        ${git_sha}"
            echo "runtime_digest: ${runtime_digest}"
            echo "suites:         ${suites}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test-client:
    name: build the e2e test client
    needs: [inventory, workspace-format, workspace-unit-static, milestone-docs]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - name: Refuse Cargo profile overrides
        shell: bash
        run: |
          set -euo pipefail
          overrides="$(env | cut -d= -f1 | grep '^CARGO_PROFILE_' || true)"
          [ -z "$overrides" ] || { echo "CARGO_PROFILE_* overrides are not allowed: $overrides" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Reclaim runner disk before the release test build
        # The release `it` binary is a full LTO test build; keep the `df -h`
        # lines as direct free-space evidence.
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lumen-e2e-x86_64-unknown-linux-musl
      - name: Build the static it binary
        # rust-tests.md: the one `it` executable cargo reports.
        shell: bash
        run: |
          set -euo pipefail
          exe="$(cargo test --release --locked -p lumen --target x86_64-unknown-linux-musl --test it --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "it") | .executable')"
          [ "$(printf '%s\n' "$exe" | grep -c .)" -eq 1 ] || { echo "expected one it executable, got: $exe" >&2; exit 1; }
          mkdir -p dist/linux/amd64
          cp "$exe" dist/linux/amd64/lumen-it
      - name: Stage kubectl
        # kubectl v1.37.0, checked by digest.
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl -o dist/linux/amd64/kubectl
          echo '6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f  dist/linux/amd64/kubectl' | sha256sum -c -
          chmod 0755 dist/linux/amd64/lumen-it dist/linux/amd64/kubectl
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Name the test client image
        id: tag
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'tag=ghcr.io/faberline/lumen-test-client:sha-%s\n' "${SOURCE_SHA::12}" >>"$GITHUB_OUTPUT"
      - name: Build and push the test client image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.test
          target: test-client
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
      - name: Pin the test client image by digest
        id: ref
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'test client image digest is missing' >&2; exit 1; }
          printf 'image=%s@%s\n' "$TAG" "$DIGEST" >>"$GITHUB_OUTPUT"
          printf 'TEST CLIENT %s@%s\n' "$TAG" "$DIGEST"

  standalone-container:
    # The image-targeted suite e2e::standalone_container:: (bind, durable) on
    # the same pinned root, under docker on the runner instead of the cluster.
    # The release candidate's container-smoke job runs the same filter on the
    # candidate root; e2e::standalone_filter_matches_module pins both.
    name: standalone container e2e
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Reclaim runner disk before the cargo test build
        # The debug `it` test binary is large; keep the `df -h` lines as
        # direct free-space evidence.
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lumen-e2e-standalone
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run the standalone container suite
        env:
          CARGO_INCREMENTAL: '0'
          E2E_STANDALONE_IMAGE: ${{ needs.resolve.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p lumen --test it -- e2e::standalone_container:: --ignored --test-threads=1

  gke-test:
    name: GKE e2e (${{ matrix.suite }})
    needs: [resolve, test-client]
    # One call at a time: the repository's concurrency group in aw keeps only
    # one waiting run. fail-fast off runs the other suites when one fails.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.resolve.outputs.suites) }}
    permissions:
      id-token: write
      contents: read
      packages: read
    uses: faberline/aw/.github/workflows/gke-test.yml@6eb7ebcdf38343e0d4c77f8674b6bc30976d86bb
    with:
      aw-ref: 6eb7ebcdf38343e0d4c77f8674b6bc30976d86bb
      image: ${{ needs.resolve.outputs.image }}
      image-name: ghcr.io/faberline/lumen
      namespace: lumen
      test-job: k8s/gke-test-job/${{ matrix.suite }}
      test-image: ${{ needs.test-client.outputs.image }}
      test-image-name: lumen-test-client
      test-env: ${{ needs.resolve.outputs.test-env }}
      evidence-suffix: ${{ matrix.suite }}

  workspace-contracts:
    name: integration contracts (${{ matrix.package }}, ${{ matrix.profile }})
    needs: [inventory, workspace-format, workspace-unit-static, milestone-docs]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.inventory.outputs.contracts) }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: candidate -> target
          shared-key: lumen-functional-${{ matrix.profile }}
          cache-on-failure: true
          cache-workspace-crates: false
      - name: Install digest-verified generated client compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 candidate/scripts/pr-gates/install-client-tools.py --dest "$RUNNER_TEMP/lumen-client-tools"
          echo "$RUNNER_TEMP/lumen-client-tools" >> "$GITHUB_PATH"
      - name: Verify complete integration rosters and retain uncovered ignored tests as failures
        env:
          PROFILE: ${{ matrix.profile }}
          PACKAGE: ${{ matrix.package }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 candidate/scripts/pr-gates/contracts.py run --root candidate --baseline-root baseline --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE" --package "$PACKAGE" --profile "$PROFILE"

  native-contracts:
    name: ${{ matrix.job }}
    needs: [inventory, workspace-format, workspace-unit-static, milestone-docs, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: functional
            job: native functional contracts
          - suite: performance
            job: native resource and performance contracts
    env:
      CARGO_INCREMENTAL: "0"
      LUMEN_DOCKER_CANDIDATE_IMAGE: ${{ needs.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: candidate -> target
          shared-key: lumen-native-contracts-${{ matrix.suite }}
          cache-on-failure: true
          cache-workspace-crates: false
      - name: Install immutable contract tools
        shell: bash
        run: |
          set -euo pipefail
          python3 candidate/scripts/pr-gates/install-native-tools.py --dest "$RUNNER_TEMP/lumen-native-tools"
          echo "$RUNNER_TEMP/lumen-native-tools" >> "$GITHUB_PATH"
          echo "LUMEN_TOXIPROXY_SERVER=$RUNNER_TEMP/lumen-native-tools/toxiproxy-server" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Execute every selected hosted contract and verify its full harness
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          SUITE: ${{ matrix.suite }}
        run: python3 candidate/scripts/pr-gates/external.py --root candidate --baseline-root baseline --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE" --suite "$SUITE"

  measured-performance:
    name: measured performance
    needs: [inventory, workspace-format, workspace-unit-static, milestone-docs]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: candidate -> target
          shared-key: lumen-measured-performance
          cache-on-failure: true
          cache-workspace-crates: false
      - name: Run original coarse and index performance gates without changing limits
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 candidate/scripts/pr-gates/measure.py --root candidate --baseline-root baseline --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE"

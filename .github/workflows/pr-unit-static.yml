name: PR unit, static and milestone contracts
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  # A GKE caller runs the same checks as a dependency. Do not let that call
  # cancel the separately required pull-request run, or the other way around.
  group: pr-unit-static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory:
    name: workspace unit inventory and controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Run isolated gate controls
        working-directory: candidate
        run: python3 -m unittest discover -s scripts/pr-gates/tests -q
      - name: Inventory every library and binary with manifest feature profiles
        id: plan
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 candidate/scripts/pr-gates/plan.py inventory --root candidate --baseline-root baseline --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE"
          echo "matrix=$(python3 candidate/scripts/pr-gates/plan.py matrix --root candidate --baseline-root baseline --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE")" >> "$GITHUB_OUTPUT"
  workspace-format:
    name: workspace formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Check complete workspace formatting
        run: cargo fmt --all -- --check
  workspace-unit-static:
    name: unit-static (${{ matrix.package }}, ${{ matrix.profile }})
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: candidate -> target
          shared-key: pr-unit-static-${{ matrix.package }}
          cache-on-failure: true
          cache-workspace-crates: false
      - name: Run all enabled library and binary unit targets; require complete nonzero rosters
        env:
          PACKAGE: ${{ matrix.package }}
          PROFILE: ${{ matrix.profile }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          CARGO_INCREMENTAL: "0"
        run: python3 candidate/scripts/pr-gates/plan.py run --root candidate --baseline-root baseline --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE" --package "$PACKAGE" --profile "$PROFILE" --kind unit
      - name: Clippy over all targets with warnings denied
        if: ${{ !cancelled() }}
        env:
          PACKAGE: ${{ matrix.package }}
          PROFILE: ${{ matrix.profile }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          CARGO_INCREMENTAL: "0"
        run: python3 candidate/scripts/pr-gates/plan.py run --root candidate --baseline-root baseline --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE" --package "$PACKAGE" --profile "$PROFILE" --kind clippy
  milestone-docs:
    name: milestone document contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify frozen proposed policy bytes
        run: |
          echo "3631fa4b106144de40ec4d55ff8bc06df09f08d731bd31d2ca15d5c8f2d8c69d  scripts/pr-gates/docs.py" | sha256sum --check
          echo "58ed020068f1c70b8043c23fd4eee1b157c9a70a3e11516eb7811872fca920fb  docs/ci-qualification/milestones.json" | sha256sum --check
      - name: Validate native milestone identities, tracking labels and outcome sections
        run: python3 scripts/pr-gates/docs.py --fixture docs/ci-qualification/milestones.json --fixture-sha256 58ed020068f1c70b8043c23fd4eee1b157c9a70a3e11516eb7811872fca920fb

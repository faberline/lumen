name: lumen-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Lumen semver without the lumen@ prefix.
        required: true
        type: string
      candidate_run_id:
        description: Exact successful lumen-release-candidate run ID.
        required: true
        type: string
      standalone_gke_receipt_b64:
        description: Base64 of the sanitized lumen-standalone-gke-receipt.json bytes.
        required: false
        type: string
      standalone_gke_receipt_sha256:
        description: Lowercase SHA-256 of the sanitized lumen-standalone-gke-receipt.json bytes.
        required: false
        type: string
      standalone_gke_receipt_sidecar_b64:
        description: Base64 of the exact lumen-standalone-gke-receipt.json.sha256 sidecar bytes.
        required: false
        type: string
      standalone_gke_receipt_sidecar_sha256:
        description: Lowercase SHA-256 of the exact lumen-standalone-gke-receipt.json.sha256 sidecar bytes.
        required: false
        type: string
      durable_perf_evidence_commit:
        description: Commit whose release-evidence/lumen@<version>/ tree holds the local durable performance evidence (lumen@0.6.1 and later).
        required: false
        type: string
      durable_perf_summary_sha256:
        description: Lowercase SHA-256 of that durable-perf-summary.json (lumen@0.6.1 and later).
        required: false
        type: string

concurrency:
  group: lumen-release-promotion-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-inputs:
    name: prove immutable tag and candidate receipt
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
      pull-requests: read
    outputs:
      root_digest: ${{ steps.contract.outputs.root_digest }}
      amd64_digest: ${{ steps.contract.outputs.amd64_digest }}
      arm64_digest: ${{ steps.contract.outputs.arm64_digest }}
      candidate_attempt: ${{ steps.contract.outputs.candidate_attempt }}
      candidate_url: ${{ steps.contract.outputs.candidate_url }}
      pr_url: ${{ steps.contract.outputs.pr_url }}
      standalone_gke_receipt_sha256: ${{ steps.contract.outputs.standalone_gke_receipt_sha256 }}
      durable_perf_summary_sha256: ${{ steps.contract.outputs.durable_perf_summary_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Refuse the retired tag-first route
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || { echo "promotion is workflow_dispatch only" >&2; exit 1; }
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version input" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/lumen@${{ inputs.version }}" ]] || { echo "promotion must dispatch the exact annotated release tag" >&2; exit 1; }
          [[ "$GITHUB_WORKFLOW_REF" == "${GITHUB_REPOSITORY}/.github/workflows/lumen-release.yml@${GITHUB_REF}" ]] || { echo "promotion workflow identity mismatch" >&2; exit 1; }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Decode and bind sanitized standalone GKE receipt
        id: gke_receipt
        env:
          STANDALONE_GKE_RECEIPT_B64: ${{ inputs.standalone_gke_receipt_b64 }}
          STANDALONE_GKE_RECEIPT_SHA256: ${{ inputs.standalone_gke_receipt_sha256 }}
          STANDALONE_GKE_RECEIPT_SIDECAR_B64: ${{ inputs.standalone_gke_receipt_sidecar_b64 }}
          STANDALONE_GKE_RECEIPT_SIDECAR_SHA256: ${{ inputs.standalone_gke_receipt_sidecar_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$STANDALONE_GKE_RECEIPT_B64$STANDALONE_GKE_RECEIPT_SHA256$STANDALONE_GKE_RECEIPT_SIDECAR_B64$STANDALONE_GKE_RECEIPT_SIDECAR_SHA256" ]]; then
            { echo "receipt="; echo "sidecar="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p gke-receipt
          decode_exact() {
            local encoded="$1" expected="$2" output="$3" actual
            [[ "$encoded" =~ ^[A-Za-z0-9+/]+={0,2}$ && $((${#encoded} % 4)) -eq 0 ]] || { echo "receipt input is not canonical base64" >&2; exit 1; }
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "receipt input SHA-256 is invalid" >&2; exit 1; }
            printf '%s' "$encoded" | base64 --decode > "$output"
            actual="$(sha256sum "$output" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "receipt input SHA-256 does not bind decoded bytes" >&2; exit 1; }
          }
          decode_exact "$STANDALONE_GKE_RECEIPT_B64" "$STANDALONE_GKE_RECEIPT_SHA256" gke-receipt/lumen-standalone-gke-receipt.json
          decode_exact "$STANDALONE_GKE_RECEIPT_SIDECAR_B64" "$STANDALONE_GKE_RECEIPT_SIDECAR_SHA256" gke-receipt/lumen-standalone-gke-receipt.json.sha256
          {
            echo "receipt=$PWD/gke-receipt/lumen-standalone-gke-receipt.json"
            echo "sidecar=$PWD/gke-receipt/lumen-standalone-gke-receipt.json.sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Fetch exact durable performance evidence
        id: durable_perf
        env:
          DURABLE_PERF_EVIDENCE_COMMIT: ${{ inputs.durable_perf_evidence_commit }}
          DURABLE_PERF_SUMMARY_SHA256: ${{ inputs.durable_perf_summary_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DURABLE_PERF_EVIDENCE_COMMIT$DURABLE_PERF_SUMMARY_SHA256" ]]; then
            echo "dir=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$DURABLE_PERF_EVIDENCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "durable performance evidence commit is invalid" >&2; exit 1; }
          git fetch --no-tags --depth 1 origin "$DURABLE_PERF_EVIDENCE_COMMIT"
          mkdir -p durable-perf
          git archive "$DURABLE_PERF_EVIDENCE_COMMIT" "release-evidence/lumen@${{ inputs.version }}" | tar -x -C durable-perf --strip-components=2
          echo "dir=$PWD/durable-perf" >> "$GITHUB_OUTPUT"
      - name: Verify tag ruleset, candidate receipt, and supply chain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-release-artifacts.sh \
            --repo faberline/lumen \
            --tag "lumen@${{ inputs.version }}" \
            --commit "$GITHUB_SHA" \
            --candidate-run-id "${{ inputs.candidate_run_id }}" \
            --mode candidate \
            --standalone-gke-receipt "${{ steps.gke_receipt.outputs.receipt }}" \
            --standalone-gke-receipt-sidecar "${{ steps.gke_receipt.outputs.sidecar }}" \
            --durable-perf-dir "${{ steps.durable_perf.outputs.dir }}" \
            --durable-perf-summary-sha256 "${{ inputs.durable_perf_summary_sha256 }}" \
            --output promotion-contract.json
      - name: Export immutable candidate contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg commit "$GITHUB_SHA" --arg run "${{ inputs.candidate_run_id }}" --arg receipt "${{ inputs.standalone_gke_receipt_sha256 }}" --arg perf "${{ inputs.durable_perf_summary_sha256 }}" '
            .commit == $commit and .candidate_run_id == $run and
            (.standalone_gke_receipt_sha256 // "") == $receipt and
            (.durable_perf_summary_sha256 // "") == $perf and
            ([.root_digest,.amd64_digest,.arm64_digest] | all(test("^sha256:[0-9a-f]{64}$")))
          ' promotion-contract.json >/dev/null
          {
            echo "root_digest=$(jq -r .root_digest promotion-contract.json)"
            echo "amd64_digest=$(jq -r .amd64_digest promotion-contract.json)"
            echo "arm64_digest=$(jq -r .arm64_digest promotion-contract.json)"
            echo "candidate_attempt=$(jq -r .candidate_attempt promotion-contract.json)"
            echo "candidate_url=$(jq -r .candidate_url promotion-contract.json)"
            echo "pr_url=$(jq -r .pr_url promotion-contract.json)"
            echo "standalone_gke_receipt_sha256=$(jq -r '.standalone_gke_receipt_sha256 // ""' promotion-contract.json)"
            echo "durable_perf_summary_sha256=$(jq -r '.durable_perf_summary_sha256 // ""' promotion-contract.json)"
          } >> "$GITHUB_OUTPUT"

  publish-release:
    name: promote exact candidate root and publish release
    needs: verify-inputs
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Decode and bind sanitized standalone GKE receipt
        id: gke_receipt
        env:
          STANDALONE_GKE_RECEIPT_B64: ${{ inputs.standalone_gke_receipt_b64 }}
          STANDALONE_GKE_RECEIPT_SHA256: ${{ inputs.standalone_gke_receipt_sha256 }}
          STANDALONE_GKE_RECEIPT_SIDECAR_B64: ${{ inputs.standalone_gke_receipt_sidecar_b64 }}
          STANDALONE_GKE_RECEIPT_SIDECAR_SHA256: ${{ inputs.standalone_gke_receipt_sidecar_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$STANDALONE_GKE_RECEIPT_B64$STANDALONE_GKE_RECEIPT_SHA256$STANDALONE_GKE_RECEIPT_SIDECAR_B64$STANDALONE_GKE_RECEIPT_SIDECAR_SHA256" ]]; then
            { echo "receipt="; echo "sidecar="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p gke-receipt
          decode_exact() {
            local encoded="$1" expected="$2" output="$3" actual
            [[ "$encoded" =~ ^[A-Za-z0-9+/]+={0,2}$ && $((${#encoded} % 4)) -eq 0 ]] || { echo "receipt input is not canonical base64" >&2; exit 1; }
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "receipt input SHA-256 is invalid" >&2; exit 1; }
            printf '%s' "$encoded" | base64 --decode > "$output"
            actual="$(sha256sum "$output" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "receipt input SHA-256 does not bind decoded bytes" >&2; exit 1; }
          }
          decode_exact "$STANDALONE_GKE_RECEIPT_B64" "$STANDALONE_GKE_RECEIPT_SHA256" gke-receipt/lumen-standalone-gke-receipt.json
          decode_exact "$STANDALONE_GKE_RECEIPT_SIDECAR_B64" "$STANDALONE_GKE_RECEIPT_SIDECAR_SHA256" gke-receipt/lumen-standalone-gke-receipt.json.sha256
          {
            echo "receipt=$PWD/gke-receipt/lumen-standalone-gke-receipt.json"
            echo "sidecar=$PWD/gke-receipt/lumen-standalone-gke-receipt.json.sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Fetch exact durable performance evidence
        id: durable_perf
        env:
          DURABLE_PERF_EVIDENCE_COMMIT: ${{ inputs.durable_perf_evidence_commit }}
          DURABLE_PERF_SUMMARY_SHA256: ${{ inputs.durable_perf_summary_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DURABLE_PERF_EVIDENCE_COMMIT$DURABLE_PERF_SUMMARY_SHA256" ]]; then
            echo "dir=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$DURABLE_PERF_EVIDENCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "durable performance evidence commit is invalid" >&2; exit 1; }
          git fetch --no-tags --depth 1 origin "$DURABLE_PERF_EVIDENCE_COMMIT"
          mkdir -p durable-perf
          git archive "$DURABLE_PERF_EVIDENCE_COMMIT" "release-evidence/lumen@${{ inputs.version }}" | tar -x -C durable-perf --strip-components=2
          echo "dir=$PWD/durable-perf" >> "$GITHUB_OUTPUT"
      - name: Re-query exact candidate immediately before stable writes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-release-artifacts.sh \
            --repo faberline/lumen \
            --tag "lumen@${{ inputs.version }}" \
            --commit "$GITHUB_SHA" \
            --candidate-run-id "${{ inputs.candidate_run_id }}" \
            --mode candidate \
            --standalone-gke-receipt "${{ steps.gke_receipt.outputs.receipt }}" \
            --standalone-gke-receipt-sidecar "${{ steps.gke_receipt.outputs.sidecar }}" \
            --durable-perf-dir "${{ steps.durable_perf.outputs.dir }}" \
            --durable-perf-summary-sha256 "${{ inputs.durable_perf_summary_sha256 }}" \
            --output promotion-contract.json
          jq -e \
            --arg root "${{ needs.verify-inputs.outputs.root_digest }}" \
            --arg amd64 "${{ needs.verify-inputs.outputs.amd64_digest }}" \
            --arg arm64 "${{ needs.verify-inputs.outputs.arm64_digest }}" \
            --arg receipt "${{ needs.verify-inputs.outputs.standalone_gke_receipt_sha256 }}" \
            --arg perf "${{ needs.verify-inputs.outputs.durable_perf_summary_sha256 }}" \
            '.root_digest == $root and .amd64_digest == $amd64 and .arm64_digest == $arm64 and (.standalone_gke_receipt_sha256 // "") == $receipt and (.durable_perf_summary_sha256 // "") == $perf' \
            promotion-contract.json >/dev/null
      - name: Exit safely if this exact public release already exists
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          query="query(\$owner:String!, \$name:String!, \$tag:String!) { repository(owner:\$owner, name:\$name) { release(tagName:\$tag) { id } } }"
          json="$(gh api graphql -f query="$query" -f owner="$GITHUB_REPOSITORY_OWNER" -f name="${GITHUB_REPOSITORY#*/}" -f tag="lumen@${{ inputs.version }}")"
          if [[ "$(jq -r '.data.repository.release | if . == null then "absent" else "present" end' <<<"$json")" == present ]]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Verify existing public release without moving latest
        if: steps.existing_release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-release-artifacts.sh \
            --repo faberline/lumen \
            --tag "lumen@${{ inputs.version }}" \
            --commit "$GITHUB_SHA" \
            --candidate-run-id "${{ inputs.candidate_run_id }}" \
            --mode public \
            --standalone-gke-receipt "${{ steps.gke_receipt.outputs.receipt }}" \
            --standalone-gke-receipt-sidecar "${{ steps.gke_receipt.outputs.sidecar }}" \
            --durable-perf-dir "${{ steps.durable_perf.outputs.dir }}" \
            --durable-perf-summary-sha256 "${{ inputs.durable_perf_summary_sha256 }}" \
            --output promotion-contract.json
      - name: Download exact candidate release bytes
        if: steps.existing_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "${{ inputs.candidate_run_id }}" --repo "$GITHUB_REPOSITORY" --name "lumen-release-candidate-${{ inputs.candidate_run_id }}-${{ needs.verify-inputs.outputs.candidate_attempt }}" --dir candidate
          [[ -f candidate/final-candidate-manifest.json && -f candidate/final-candidate-manifest.json.sha256 ]] || { echo "candidate receipt bytes are incomplete" >&2; exit 1; }
      - name: Promote exact root digest to semver and safe latest
        if: steps.existing_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          image_repo=ghcr.io/faberline/lumen
          root_digest="${{ needs.verify-inputs.outputs.root_digest }}"
          version="${{ inputs.version }}"
          root_ref="${image_repo}@${root_digest}"
          semver_ref="${image_repo}:${version}"
          digest_or_absent() {
            local ref="$1" error manifest status
            error="$(mktemp)"
            set +e
            manifest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>"$error")"
            status=$?
            set -e
            if [[ "$status" == 0 ]]; then
              rm -f "$error"
              jq -er '.digest' <<<"$manifest"
              return 0
            fi
            if grep -Eqi 'manifest unknown|not found' "$error"; then
              rm -f "$error"
              return 0
            fi
            cat "$error" >&2
            rm -f "$error"
            echo "cannot prove GHCR image state: $ref" >&2
            exit 1
          }
          semver_current="$(digest_or_absent "$semver_ref")"
          [[ -z "$semver_current" || "$semver_current" == "$root_digest" ]] || { echo "semver tag already points at a different root" >&2; exit 1; }
          latest_current="$(digest_or_absent "${image_repo}:latest")"
          latest_target=true
          if [[ -n "$latest_current" && "$latest_current" != "$root_digest" ]]; then
            newer_published=false
            latest_matches_newer=false
            latest_matches_older=false
            while IFS= read -r tag; do
              next="${tag#lumen@}"
              [[ "$tag" =~ ^lumen@[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
              if [[ "$(printf '%s\n%s\n' "$version" "$next" | sort -V | tail -n1)" == "$next" && "$next" != "$version" ]]; then
                newer_published=true
                digest="$(digest_or_absent "${image_repo}:${next}")"
                [[ -n "$digest" ]] || { echo "newer published semver image is absent: $next" >&2; exit 1; }
                [[ "$digest" == "$latest_current" ]] && latest_matches_newer=true
                continue
              fi
              [[ "$next" != "$version" ]] || continue
              digest="$(digest_or_absent "${image_repo}:${next}")"
              [[ -n "$digest" ]] || continue
              [[ "$digest" == "$latest_current" ]] && latest_matches_older=true
            done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft | jq -r '.[] | select(.isDraft == false) | .tagName')
            if [[ "$newer_published" == true ]]; then
              if [[ "$latest_matches_newer" == true ]]; then
                latest_target=false
              else
                echo "latest does not match a newer published semver root" >&2
                exit 1
              fi
            elif [[ "$latest_matches_older" != true ]]; then
              echo "latest does not match an older published semver root" >&2
              exit 1
            fi
          fi
          docker buildx imagetools create --tag "$semver_ref" "$root_ref"
          [[ "$(docker buildx imagetools inspect "$semver_ref" --format '{{json .Manifest}}' | jq -er '.digest')" == "$root_digest" ]] || { echo "semver tag did not bind candidate root" >&2; exit 1; }
          if [[ "$latest_target" == true ]]; then
            [[ "$(digest_or_absent "${image_repo}:latest")" == "$latest_current" ]] || { echo "latest changed before write" >&2; exit 1; }
            docker buildx imagetools create --tag "${image_repo}:latest" "$root_ref"
            [[ "$(docker buildx imagetools inspect "${image_repo}:latest" --format '{{json .Manifest}}' | jq -er '.digest')" == "$root_digest" ]] || { echo "latest tag did not bind candidate root" >&2; exit 1; }
          fi
      - name: Create exact GitHub Release with candidate bytes
        if: steps.existing_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          STANDALONE_GKE_RECEIPT_SHA256: ${{ needs.verify-inputs.outputs.standalone_gke_receipt_sha256 }}
          DURABLE_PERF_SUMMARY_SHA256: ${{ needs.verify-inputs.outputs.durable_perf_summary_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(candidate/lumen-*.tar.gz candidate/lumen-*.tar.gz.sha256 candidate/spdx-amd64.json candidate/spdx-arm64.json)
          if [[ -n "$STANDALONE_GKE_RECEIPT_SHA256" ]]; then
            evidence="- Standalone GKE receipt SHA-256: $STANDALONE_GKE_RECEIPT_SHA256"
            assets+=(gke-receipt/lumen-standalone-gke-receipt.json gke-receipt/lumen-standalone-gke-receipt.json.sha256)
          else
            evidence="- Standalone GKE: not claimed"
          fi
          if [[ -n "$DURABLE_PERF_SUMMARY_SHA256" ]]; then
            evidence+=$'\n'"- Durable performance summary SHA-256: $DURABLE_PERF_SUMMARY_SHA256"
            assets+=(durable-perf/durable-perf-summary.json durable-perf/durable-perf-summary.json.sha256)
          fi
          cat > release-notes.md <<EOF
          # lumen@${{ inputs.version }}

          - Source commit: $GITHUB_SHA
          - Pull request: ${{ needs.verify-inputs.outputs.pr_url }}
          - Candidate run: ${{ needs.verify-inputs.outputs.candidate_url }}
          - Promotion run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT
          - Root index digest: ${{ needs.verify-inputs.outputs.root_digest }}
          - linux/amd64 digest: ${{ needs.verify-inputs.outputs.amd64_digest }}
          - linux/arm64 digest: ${{ needs.verify-inputs.outputs.arm64_digest }}
          ${evidence}
          - Release path: landed main -> untagged candidate verification -> protected annotated tag -> promotion of the same candidate digest.
          - Placement path: a non-empty nodeSelector with the default initialMachineType skips the legacy capacity catalog.
          - Legacy placement path: an empty selector, tolerations-only placement, or a non-default initialMachineType still requires lumen-system/lumen-capacity-catalog.
          - Compatibility: shipped Docker images default to durable segment storage at /var/lib/lumen/data; bare lumen serve stays ephemeral without --data-dir or LUMEN_DATA_DIR. A 0.4.28 segment volume upgrades one way on first 0.4.29 start; in-place downgrade is unsupported.
          EOF
          gh release create "lumen@${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "lumen@${{ inputs.version }}" --notes-file release-notes.md \
            "${assets[@]}"
      - name: Publicly verify immutable tag, release bytes, and promoted image
        if: steps.existing_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-release-artifacts.sh \
            --repo faberline/lumen \
            --tag "lumen@${{ inputs.version }}" \
            --commit "$GITHUB_SHA" \
            --candidate-run-id "${{ inputs.candidate_run_id }}" \
            --mode public \
            --standalone-gke-receipt "${{ steps.gke_receipt.outputs.receipt }}" \
            --standalone-gke-receipt-sidecar "${{ steps.gke_receipt.outputs.sidecar }}" \
            --durable-perf-dir "${{ steps.durable_perf.outputs.dir }}" \
            --durable-perf-summary-sha256 "${{ inputs.durable_perf_summary_sha256 }}" \
            --output promotion-contract.json

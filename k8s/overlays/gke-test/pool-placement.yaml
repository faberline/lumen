# Every pod template lands on pool-lumen-server of the shared faberline-test cluster
# and pulls from GHCR with the run's ghcr-pull Secret (aw
# docs/standards/test-cluster.md). Patched as JSON 6902 `add`s so the
# same file applies to any Deployment.
- op: add
  path: /spec/template/spec/nodeSelector
  value:
    faberline.dev/pool: lumen-server
- op: add
  path: /spec/template/spec/tolerations
  value:
    - key: faberline.dev/pool
      operator: Equal
      value: lumen-server
      effect: NoSchedule
- op: add
  path: /spec/template/spec/imagePullSecrets
  value:
    - name: ghcr-pull
# One pod per node (aw docs/standards/test-cluster.md): the empty selector
# matches every pod of the namespace. It replaces the base's server-only
# anti-affinity and the operator's preferred spread. Required anti-affinity
# is symmetric, so the operator-rendered StatefulSet pod, which keeps the
# operator's own server anti-affinity, still never shares a node with these.
- op: add
  path: /spec/template/spec/affinity
  value:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector: {}

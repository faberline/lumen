apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The shipped operator install, moved into the test namespace. The shared
# cluster gives each repository exactly one namespace, so the operator runs
# beside the instances it reconciles instead of in lumen-system.
namespace: lumen

resources:
  - ../../../operator

patches:
  - target:
      kind: Namespace
      name: lumen-system
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: lumen-system

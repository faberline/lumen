# The cluster-scoped reads behind the receipt's server shape: the node the
# scheduler bound lumen-perf-0 to (pool and instance type) and the data
# claim's PersistentVolume (the disk type the PD CSI driver chose). The test
# Job cannot carry cluster-scoped objects, so the overlay does
# (faberline/aw docs/standards/test-cluster.md). The fixed names are safe
# because every lumen gke-test run shares one concurrency group; the
# replacements in kustomization.yaml set the run namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lumen-perf-cluster-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lumen-perf-cluster-reader
  labels:
    faberline.dev/owner-namespace: NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lumen-perf-cluster-reader
subjects:
  - kind: ServiceAccount
    name: lumen-perf-client
    namespace: NAMESPACE

# lumen's in-cluster test Job for Faberline's shared GKE test cluster
# (faberline/aw docs/standards/test-cluster.md).
#
# aw's run.sh deploys k8s/overlays/gke-test, waits for every rollout, sets this
# folder's namespace to the run's namespace, applies it, and passes the run
# only when Job/lumen-e2e completes. e2e.sh drives both deploy paths through
# their Services from pool-lumen-client, so no load crosses a port-forward.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lumen

resources:
  - rbac.yaml
  - job.yaml

configMapGenerator:
  - name: lumen-e2e-script
    files:
      - e2e.sh

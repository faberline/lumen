# What e2e.sh reads and does in the run's namespace, and nothing cluster-wide:
# it reads the overlay's and the operator's objects, waits on pods, reads
# Events for the legacy CR, and deletes serving pods for the restart oracle.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lumen-e2e
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lumen-e2e
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "configmaps", "endpoints", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["lumen.dev"]
    resources: ["lumens"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lumen-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lumen-e2e
subjects:
  - kind: ServiceAccount
    name: lumen-e2e
    namespace: lumen

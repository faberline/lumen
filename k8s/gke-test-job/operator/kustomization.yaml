# GKE e2e suite `operator`: e2e.sh in ../base for the Lumen CR `lumen-op` reconciled by the shipped operator,
# reached at http://lumen-op:7373, and the legacy CR that must fail on the
# missing capacity catalog.
# One call of faberline/aw's gke-test workflow, on a freshly deployed
# k8s/overlays/gke-test (.github/workflows/gke-test.yml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lumen

resources:
  - ../base

patches:
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: lumen-e2e
      spec:
        template:
          spec:
            containers:
              - name: e2e
                env:
                  - name: LUMEN_E2E_MODES
                    value: operator

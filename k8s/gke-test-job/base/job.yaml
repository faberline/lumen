# One attempt, on pool-lumen-client. A retry would re-index into the same
# servers and hide the first failure, so a failed pod fails the run. Each
# suite folder sets the test filter `e2e::<suite>::` and E2E_ENDPOINT.
apiVersion: batch/v1
kind: Job
metadata:
  name: lumen-e2e
  labels:
    app: lumen-e2e
spec:
  backoffLimit: 0
  # Below run.sh's TEST_JOB_TIMEOUT for ttl-minutes 90 (75m), so the Job
  # reports Failed itself and its pod's log still says where it stopped.
  activeDeadlineSeconds: 4200
  template:
    metadata:
      labels:
        app: lumen-e2e
    spec:
      restartPolicy: Never
      serviceAccountName: lumen-e2e
      nodeSelector:
        faberline.dev/pool: lumen-client
      tolerations:
        - key: faberline.dev/pool
          operator: Equal
          value: lumen-client
          effect: NoSchedule
      imagePullSecrets:
        - name: ghcr-pull
      # One pod per node; the empty selector matches every pod of the
      # namespace.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: test
          # tests/it built for x86_64-unknown-linux-musl as lumen-it, plus
          # kubectl (Dockerfile.test `test-client`). The run sets the
          # digest-pinned tag (TEST_IMAGE); each suite folder sets the
          # filter and E2E_ENDPOINT.
          image: lumen-test-client
          command: ["/usr/local/bin/lumen-it", "--ignored", "--test-threads=1"]
          # E2E_EXPECTED_IMAGE, _RUNTIME_DIGEST, _VERSION, and _GIT_SHA, from
          # the run (rust-tests.md rule 8).
          envFrom:
            - configMapRef:
                name: gke-test-env
          env:
            - name: E2E_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: E2E_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: E2E_DOC_COUNT
              value: "100000"
            # kubectl keeps its discovery cache under $HOME.
            - name: HOME
              value: /work
          # Small requests and no limits: the Job has the client node to
          # itself. 500m never scheduled on an e2-medium.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 1Gi

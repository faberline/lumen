# lumen's in-cluster test Job for Faberline's shared GKE test cluster
# (faberline/aw docs/standards/test-cluster.md), shared by the suites in
# ../overlay and ../operator. This folder is not a suite itself.
#
# For each suite, aw's run.sh deploys k8s/overlays/gke-test, waits for every
# rollout, sets the suite folder's namespace to the run's namespace, applies
# it, and passes the call only when Job/lumen-e2e completes. The Job runs the
# suite's Rust e2e tests (tests/it/e2e) against the deploy path's Service from
# pool-lumen-client, so no load crosses a port-forward.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lumen

resources:
  - rbac.yaml
  - job.yaml

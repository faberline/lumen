apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# The Managed client-workload patch. It changes an existing application
# Deployment; it creates no Namespace, ServiceAccount or Secret. The optional
# NetworkPolicy is a separate component in the egress directory.

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment

# Lumen's bounded contexts and layers, checked by the workspace's
# rust-arch contract (scripts/meta/rust_arch_contract.py). The [policy] table
# is copied verbatim from the canonical policy.toml; everything after it is
# Lumen's own. See docs/architecture.md for what each context owns.
schema = 1

# Enforced: the shared-kernel move, the thin lumen main and the fields split are in place.
[migration]
enforce = true

[policy]
version = 1
size_warn = 400
size_error = 1000
root_md = [
  "README.md",
  "CONTRIBUTING.md",
  "LICENSE.md",
  "CHANGELOG.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "CLAUDE.md",
  "AGENTS.md",
  # Temporary: the current project docs contract requires these at the root.
  "STATUS.md",
  "ROADMAP.md",
]
docs_required = [
  "docs/README.md",
  "docs/architecture.md",
  "docs/glossary.md",
  "docs/domain/",
  "docs/adr/",
  "docs/operations/",
]
layers = ["domain", "application", "infrastructure", "interfaces"]
# The layer held to the [policy.domain] purity rules and kept free of other contexts.
domain_layer = "domain"
# Layers another context may use. A context without any of them exposes its whole public API.
public_layers = ["application"]
# <ctx>/domain/events(.rs|/) is the only domain module other contexts may use.
domain_events = "events"
# A tests/<name>.rs binary may stand alone only when it is the crate's single test
# target, contains one of these markers, or its leading //! block carries
# `//! isolation: <reason>`. Everything else lives in tests/it/.
test_isolation_markers = ["set_var(", "remove_var(", "#[global_allocator]"]
# tests/<dir>/ names holding .rs data (fixtures, trybuild cases), not test targets.
test_data_dirs = ["fixtures", "compile_fail", "ui"]
# false: one crate may hold several contexts (B3/B4 still guard each boundary).
# true: B1 requires every crate to belong to exactly one context.
one_context_per_crate = false

# Layers each layer may use inside one context. The shared kernel is usable by
# every layer; assembly code (lib.rs, main.rs, src/bin) is unrestricted. A
# multi-file binary is src/bin/<name>/main.rs plus sibling modules: B6 keeps
# the entry file thin and does not apply to those modules.
[policy.layer_deps]
domain = []
application = ["domain"]
infrastructure = ["domain"]
interfaces = ["application"]

[policy.domain]
# Applies to every domain layer, and to the shared kernel when shared_kernel_pure.
allowed_crates = [
  "std",
  "core",
  "alloc",
  "thiserror",
  "serde",
  "serde_json",
  "chrono",
  "time",
  "uuid",
  "sha2",
  "hex",
  "regex",
  "bytes",
]
denied_paths = [
  "std::fs",
  "std::net",
  "std::process",
  "std::env",
  "std::os",
  "std::io::stdin",
  "std::io::stdout",
  "std::io::stderr",
  "std::thread::spawn",
  "std::thread::sleep",
  "std::time::SystemTime::now",
  "std::time::Instant::now",
  "chrono::Utc::now",
  "chrono::Local::now",
  "chrono::offset::Utc::now",
  "chrono::offset::Local::now",
  "time::OffsetDateTime::now_utc",
  "time::OffsetDateTime::now_local",
  "time::Instant::now",
  "uuid::Uuid::now_v7",
  "uuid::Uuid::new_v4",
]
denied_macros = ["println", "print", "eprintln", "eprint", "dbg"]
shared_kernel_pure = true

[policy.naming]
crates_dir = "crates"
domain_crate = "{repo}-{context}-domain"
context_crate = "{repo}-{context}"
shared_kernel_crate = "{repo}-shared-kernel"

# Module layout (no mod.rs) is enforced by clippy, not by this checker.
[policy.lints.clippy]
mod_module_files = "deny"

# The vocabulary every context shares: the public API's wire types, the
# committed-mutation log entry, and the apply/capture barrier.
[shared_kernel]
path = "crates/lumen-shared-kernel/src"

# Code that may use every context. `app` is the composition root (D1);
# `compat` keeps the module paths from before the split alive until outside
# callers move to the new ones (D3).
[assembly]
modules = ["crates/lumen-index/src/app", "crates/lumen/src/compat"]

[[contexts]]
name = "access"
depends_on = []
[contexts.layers]
domain = "crates/lumen-access/src/domain"
application = "crates/lumen-access/src/application"
infrastructure = "crates/lumen-access/src/infrastructure"
interfaces = "crates/lumen-access/src/interfaces"

[[contexts]]
name = "operator"
depends_on = ["access", "sharding"]
[contexts.layers]
domain = "crates/lumen-operator/src/domain"
application = "crates/lumen-operator/src/application"
infrastructure = "crates/lumen-operator/src/infrastructure"

[[contexts]]
name = "sharding"
depends_on = ["access", "index", "ingest"]
[contexts.layers]
domain = "crates/lumen-index/src/sharding/domain"
application = "crates/lumen-index/src/sharding/application"
infrastructure = "crates/lumen-index/src/sharding/infrastructure"
interfaces = "crates/lumen-index/src/sharding/interfaces"

[[contexts]]
name = "storage"
depends_on = []
[contexts.layers]
infrastructure = "crates/lumen-storage/src/infrastructure"

[[contexts]]
name = "replication"
depends_on = []
[contexts.layers]
domain = "crates/lumen-replication/src/domain"
application = "crates/lumen-replication/src/application"

[[contexts]]
name = "ingest"
depends_on = ["access"]
[contexts.layers]
domain = "crates/lumen-index/src/ingest/domain"
application = "crates/lumen-index/src/ingest/application"
infrastructure = "crates/lumen-index/src/ingest/infrastructure"
interfaces = "crates/lumen-index/src/ingest/interfaces"

[[contexts]]
name = "persistence"
depends_on = ["access", "index", "ingest", "storage"]
[contexts.layers]
domain = "crates/lumen-index/src/persistence/domain"
application = "crates/lumen-index/src/persistence/application"
infrastructure = "crates/lumen-index/src/persistence/infrastructure"
interfaces = "crates/lumen-index/src/persistence/interfaces"

[[contexts]]
name = "index"
depends_on = ["access", "storage"]
[contexts.layers]
domain = "crates/lumen-index/src/index/domain"
application = "crates/lumen-index/src/index/application"
infrastructure = "crates/lumen-index/src/index/infrastructure"
interfaces = "crates/lumen-index/src/index/interfaces"

# Layer-direction breaks the P1 split moves as-is (D2); P2 replaces each with a
# port the owning layer defines.

[[exceptions]]
rule = "B3"
paths = ["crates/lumen-access/src/infrastructure/lumen_verifier.rs"]
subject = "infrastructure->application"
reason = "LumenVerifier implements service_auth::AsyncVerifier with Principal = AuthContext and is built from AuthConfig, both application types. P2: an application-side verifier port that the adapter implements."

[[exceptions]]
rule = "B3"
paths = ["crates/lumen-access/src/interfaces/http.rs"]
subject = "interfaces->infrastructure"
reason = "auth_middleware is service_auth::async_auth_middleware instantiated at LumenVerifier, so the middleware names the adapter type. P2: instantiate it at the application-side verifier port instead."

[[exceptions]]
rule = "B3"
paths = ["crates/lumen-index/src/sharding/interfaces/http/reshard.rs"]
subject = "interfaces->domain"
reason = "The reshard verbs take the sharding domain's wire formats as their bodies (a ReshardBatch, a ReshardPruneChunk), cut /admin/backup:scoped's subset with snapshot_bucket_subset, and build the VirtualBucketShardMap /admin/reshard:evict hands the engine, as they did in api.rs. P2: a sharding application service owns the apply, prune, scoped export and evict use cases over the domain, and the verbs call it."

[[exceptions]]
rule = "B3"
paths = [
  "crates/lumen-operator/src/infrastructure/kube_hpa_control.rs",
  "crates/lumen-operator/src/infrastructure/kube_auth_delegator_control.rs",
  "crates/lumen-operator/src/infrastructure/kube_cluster_control.rs",
]
subject = "infrastructure->application"
reason = "Each Kube*Control adapter implements a control trait the application layer defines next to its only caller (HpaControl, AuthDelegatorControl, ClusterControl); kube_cluster_control also reuses reconcile's Prometheus text parser. P2: the traits move to the operator domain and the parser to the adapter."

[[exceptions]]
rule = "B3"
paths = [
  "crates/lumen-operator/src/application/fleet_reconcile.rs",
  "crates/lumen-operator/src/application/reconcile/loops.rs",
  "crates/lumen-operator/src/application/reconcile/managed_service.rs",
  "crates/lumen-operator/src/application/reshard_driver/driver_loop.rs",
]
subject = "application->infrastructure"
reason = "The leader-gated loops build their own Lease election and Kube*Control adapters, and ManagedService::apply builds KubeAuthDelegatorControl from the client it is handed. P2: the composition root builds the adapters and passes them in."

[[exceptions]]
rule = "B4"
paths = ["crates/lumen-operator/src/application/render/identity.rs"]
subject = "access.domain"
reason = "control_plane_token() mounts the projected token at access's AUDIENCE, the value the verifier checks. P2: access exposes the control-plane token's audience through its application layer, next to CONTROL_PLANE_TOKEN_MOUNT."

[[exceptions]]
rule = "B4"
paths = [
  "crates/lumen-operator/src/application/reshard_driver/catch_up_fenced.rs",
  "crates/lumen-operator/src/application/reshard_driver/checkpoint.rs",
  "crates/lumen-operator/src/application/reshard_driver/fence.rs",
  "crates/lumen-operator/src/application/reshard_driver/migration.rs",
  "crates/lumen-operator/src/application/reshard_driver/oversize.rs",
  "crates/lumen-operator/src/application/reshard_driver/phases.rs",
  "crates/lumen-operator/src/application/reshard_driver/transfer.rs",
  "crates/lumen-operator/src/application/reshard_driver/trigger.rs",
]
subject = "sharding.domain"
reason = "The reshard driver plans and sizes each split with sharding's domain primitives: VirtualBucketShardMap, bucket_moves, snapshot_reshard_batches, snapshot_reshard_prune_chunks, ReshardBatch, ReshardPruneChunk and ADMIN_ROUTE_BODY_LIMIT_BYTES. P2: sharding's application layer exposes the split-planning API the driver calls."

[[exceptions]]
rule = "B4"
paths = ["crates/lumen-operator/src/domain/lumen_spec/topology.rs"]
subject = "sharding.domain"
reason = "The CRD's shardMap.virtualBucketCount default is sharding's DEFAULT_VIRTUAL_BUCKET_COUNT, so the operator never renders a map the data plane reads differently. P2: the constant moves to the shared kernel."

[[exceptions]]
rule = "B3"
paths = ["crates/lumen-index/src/sharding/infrastructure/routed_router/scatter.rs"]
subject = "infrastructure->application"
reason = "scatter_search merges the local and forwarded pages with search_fanout's merge_shard_search_responses and search_request_offset, the merge EngineShardSearch uses in-process, so both rank a scattered search the same way. P2: the merge moves to the sharding domain and both callers use it there."

[[exceptions]]
rule = "B3"
paths = ["crates/lumen-index/src/sharding/infrastructure/routed_router/backend.rs"]
subject = "infrastructure->application"
reason = "RoutedRouter implements RoutedBackend, the port the HTTP handlers consult before the local backends. The port lives in sharding's application layer because every method takes the inbound HeaderMap and drop_collection returns index's DropOutcome, neither of which the domain may name. P2: the port moves to the sharding domain once the forwarded request context is a domain value and the drop outcome is ingest's (see the ingest write-port exception below)."

# The Lumen and LumenFleet custom resources are the operator's domain model,
# and their Rust types are also the CRD schema (E1). P2 splits the schema into
# DTOs with a mapper; until then the domain names the crates the schema needs.

[[exceptions]]
rule = "B2"
paths = [
  "crates/lumen-operator/src/domain/lumen_spec.rs",
  "crates/lumen-operator/src/domain/lumen_fleet.rs",
]
subject = "kube"
reason = "E1: #[derive(CustomResource)] on Lumen and LumenFleet. P2: CRD DTOs outside the domain."

[[exceptions]]
rule = "B2"
paths = [
  "crates/lumen-operator/src/domain/lumen_spec.rs",
  "crates/lumen-operator/src/domain/lumen_spec/serving.rs",
  "crates/lumen-operator/src/domain/lumen_spec/status.rs",
  "crates/lumen-operator/src/domain/lumen_spec/topology.rs",
  "crates/lumen-operator/src/domain/lumen_fleet.rs",
]
subject = "schemars"
reason = "E1: #[derive(JsonSchema)] on the CRD spec and status types, plus LumenFleet's hand-written preserve-unknown-fields schema. P2: CRD DTOs outside the domain."

[[exceptions]]
rule = "B2"
paths = ["crates/lumen-operator/src/domain/lumen_spec/serving.rs"]
subject = "service_backup"
reason = "E1: ServingBackupSpec flattens the shared ScheduledBackupPolicy into the CRD, so spec.serving.backup's schema is the shared one. P2: the DTO keeps the flatten and the domain gets its own policy type."

[[exceptions]]
rule = "B2"
paths = ["crates/lumen-operator/src/domain/lumen_spec/status.rs"]
subject = "service_k8s"
reason = "E1: LumenStatus.conditions is the shared metav1.Condition type every service's status projects to. P2: the DTO keeps the shared type and the domain gets its own condition facts."

[[exceptions]]
rule = "B2"
paths = ["crates/lumen-operator/src/domain/lumen_fleet/plan.rs"]
subject = "serde_path_to_error"
reason = "plan() deserializes the merged per-namespace spec through serde_path_to_error so a rejection names the offending field. P2: the deserialization moves with the CRD DTOs."

# The sharding domain moved as-is (D2): its map constructors and reshard
# primitives report errors through anyhow, and the routing hash is CRC-32.

[[exceptions]]
rule = "B2"
paths = [
  "crates/lumen-index/src/sharding/domain/bucket_move.rs",
  "crates/lumen-index/src/sharding/domain/merge_delta.rs",
  "crates/lumen-index/src/sharding/domain/prune_chunk.rs",
  "crates/lumen-index/src/sharding/domain/reshard_batch.rs",
  "crates/lumen-index/src/sharding/domain/snapshot_subset.rs",
  "crates/lumen-index/src/sharding/domain/virtual_bucket_shard_map.rs",
]
subject = "anyhow"
reason = "The map constructors and the reshard primitives return anyhow::Result, which app::http, index::application::engine and operator::application::reshard_driver propagate with ?. P2: a sharding domain error type (thiserror) that the callers convert."

[[exceptions]]
rule = "B2"
paths = ["crates/lumen-index/src/sharding/domain/virtual_bucket_shard_map.rs"]
subject = "crc32fast"
reason = "route_hash is CRC-32 over the collection id and the routing key. Every stored document's bucket depends on it, so the algorithm is part of the routing contract and cannot change. P2: decide whether the domain may use crc32fast (pure, no I/O) or takes the hash from the shared kernel."

# The replication domain (lumen-replication) reads raft_runtime's canonical
# cluster shapes, and its constructors report errors through anyhow.

[[exceptions]]
rule = "B2"
paths = [
  "crates/lumen-replication/src/domain/cluster_config.rs",
  "crates/lumen-replication/src/domain/cluster_state.rs",
  "crates/lumen-replication/src/domain/peer_addr.rs",
  "crates/lumen-replication/src/domain/runtime_shapes.rs",
]
subject = "raft_runtime"
reason = "ReadConsistency is raft_runtime's, re-exported; runtime_shapes maps raft_runtime's RaftRole, PeerAddr and ClusterStateView onto the kernel's wire types; RaftGroup::from_config takes peer ordinals and the LUMEN_PEERS override from raft_runtime::cluster, so the peers it lists match the ones the raft-wal wiring dials. P2: the conversions and the LUMEN_PEERS read move to an infrastructure adapter, and the domain decides whether raft_runtime's pure cluster types count as a shared kernel."

[[exceptions]]
rule = "B2"
paths = [
  "crates/lumen-replication/src/domain/cluster_config.rs",
  "crates/lumen-replication/src/domain/cluster_state.rs",
  "crates/lumen-replication/src/domain/peer_addr.rs",
]
subject = "anyhow"
reason = "ClusterConfig::from_env, ClusterState::new and RaftGroup::from_config return anyhow::Result, which the bin's --wal raft setup wraps with .context() and propagates. P2: a replication domain error type (thiserror) that the callers convert."

# The shared kernel moved as-is (D2): the wire types carry their OpenAPI schema
# and report a malformed vector field through anyhow, and the capture barrier
# times how long it is held.

[[exceptions]]
rule = "B2"
paths = [
  "crates/lumen-shared-kernel/Cargo.toml",
  "crates/lumen-shared-kernel/src/types/api_error.rs",
  "crates/lumen-shared-kernel/src/types/cluster_state_view.rs",
  "crates/lumen-shared-kernel/src/types/document.rs",
  "crates/lumen-shared-kernel/src/types/peer_addr.rs",
  "crates/lumen-shared-kernel/src/types/query.rs",
  "crates/lumen-shared-kernel/src/types/raft_role.rs",
  "crates/lumen-shared-kernel/src/types/schema.rs",
  "crates/lumen-shared-kernel/src/types/search.rs",
  "crates/lumen-shared-kernel/src/types/stats.rs",
]
subject = "utoipa"
reason = "E1: #[derive(ToSchema)] on the public HTTP API's request and response types, which clients/openapi.json publishes, and on the /debug/cluster response (ClusterStateView, PeerAddr, RaftRole), so raft_runtime's shared types need not derive ToSchema. The engine uses the same types as its domain vocabulary. P2: OpenAPI DTOs outside the kernel, with mappers; their serde is also the RDB, AOF and WAL CBOR format, so the wire bytes must stay identical."

[[exceptions]]
rule = "B2"
paths = [
  "crates/lumen-shared-kernel/Cargo.toml",
  "crates/lumen-shared-kernel/src/types/schema.rs",
]
subject = "anyhow"
reason = "FieldSpec::vector_spec returns anyhow::Result, which storage.rs and segment_rdb.rs propagate with ?. P2: a kernel error type (thiserror) that the callers convert."

[[exceptions]]
rule = "B2"
paths = ["crates/lumen-shared-kernel/src/capture_barrier.rs"]
subject = "std::time::Instant::now"
reason = "E4: CaptureBarrier times how long each apply record and each capture holds it (HoldTiming); only its own tests read the timing today. P2: a Clock port, as for the index context's clock reads."

# The ingest domain moved as-is (D2): the change budget wakes its async waiters
# through tokio and bounds its blocking wait with the clock.

[[exceptions]]
rule = "B2"
paths = [
  "crates/lumen-index/src/ingest/domain/change_budget.rs",
  "crates/lumen-index/src/ingest/domain/change_budget/budget.rs",
  "crates/lumen-index/src/ingest/domain/change_budget/budget_wake.rs",
]
subject = "tokio"
reason = "BudgetWake keeps a tokio::sync::Notify beside its Condvar, so the async checkpoint driver and async admissions wait for a budget change without holding a blocking thread; wait_for_change_async bounds that wait with tokio::time::timeout. P2: a wake port the domain signals, with the Condvar and the Notify behind it in infrastructure."

[[exceptions]]
rule = "B2"
paths = ["crates/lumen-index/src/ingest/domain/change_budget/budget_wake.rs"]
subject = "std::time::Instant::now"
reason = "E4: wait_for_change_timeout turns its timeout into a deadline and re-reads the clock after each spurious Condvar wake. P2: a Clock port, or the wait moves to infrastructure with the wake port."

# WalLog, the log seam writes publish through, moved to the ingest domain as-is
# (D2); its signature still names the runtime types it was written against.

[[exceptions]]
rule = "B2"
paths = ["crates/lumen-index/src/ingest/domain/wal_log.rs"]
subject = "anyhow"
reason = "WalLog's methods return anyhow::Result, the error type MemWal, the raft write sink and the apply loop already share. P2: a WAL error type in the domain that the backends map into, or the error type moves with the port."

[[exceptions]]
rule = "B2"
paths = ["crates/lumen-index/src/ingest/domain/wal_log.rs"]
subject = "async_trait"
reason = "WalLog is an async trait held as Arc<dyn WalLog> (SharedWal), so its methods are boxed with #[async_trait] to stay object-safe. P2: decided with where WalLog lives (see the domain->infrastructure exception below)."

[[exceptions]]
rule = "B2"
paths = ["crates/lumen-index/src/ingest/domain/wal_log.rs"]
subject = "futures"
reason = "WalStream and WalAdmissionStream are boxed futures::Stream subscriptions, and subscribe_admitted's default maps the resident stream with StreamExt. P2: the stream types move with WalLog (see the domain->infrastructure exception below)."

[[exceptions]]
rule = "B3"
paths = ["crates/lumen-index/src/ingest/domain/wal_log.rs"]
subject = "domain->infrastructure"
reason = "Only WalLog's signature references the delivery types: WalAdmissionStream yields WalDelivery and stage_source returns WalSourceRelease. They stay in infrastructure beside MemWal because WalSourceRecord holds MemWal's private slot and WalDelivery hands out mmap payloads. P2 chooses between a delivery handle trait the domain defines and infrastructure implements, or moving WalLog to ingest/application/ports."

# Durable staging stays in ingest/infrastructure; three of its types still
# appear in domain signatures.

[[exceptions]]
rule = "B3"
paths = [
  "crates/lumen-index/src/ingest/domain/change_admission.rs",
  "crates/lumen-index/src/ingest/domain/change_admission/tests.rs",
  "crates/lumen-index/src/ingest/domain/change_budget.rs",
  "crates/lumen-index/src/ingest/domain/change_budget/reservation.rs",
]
subject = "domain->infrastructure"
reason = "SourceIdentity is carried by RamCharge and Reservation::commit_ram, and change_admission's staging bridge stages into a StageStore and holds the DurableStage it returns. SourceIdentity and SourceKind stay in infrastructure beside the marker encoding because SourceIdentity::new and SourceKind::decode return io::Result and the marker reads their private fields. P2: change that error type, move SourceIdentity and SourceKind into the ingest domain, and have the staging bridge depend on a stage-store port the domain defines."

# The write coordinator moved to ingest/application as-is; it still holds and
# parses WAL types that stay in infrastructure.

[[exceptions]]
rule = "B3"
paths = [
  "crates/lumen-index/src/ingest/application/write_coordinator.rs",
  "crates/lumen-index/src/ingest/application/write_coordinator/committed_scalar.rs",
]
subject = "application->infrastructure"
reason = "PendingApply and MappedApply hold the WalDelivery the log handed the apply loop, and the committed scalar path parses the pinned payload with FastIndexScanner before it applies. Both stay in ingest/infrastructure/wal beside MemWal (see the wal_log exception above). P2: the delivery handle trait decided there, and scanning behind a port the application layer defines."

# EngineSm, ingest's raft write path, bounds and scans a raft command with the
# same WAL code the WAL write path uses.

[[exceptions]]
rule = "B3"
paths = [
  "crates/lumen-index/src/ingest/application/engine_sm.rs",
  "crates/lumen-index/src/ingest/application/engine_sm/state_machine.rs",
]
subject = "application->infrastructure"
reason = "EngineSm bounds a raft command's decode workspace with wire_cost::scan_workspace_bytes and applies a retained oversized fast-Index command through FastIndexScanner, the same bound and scanner the WAL path uses. P2: ingest's application layer exposes both."

[[exceptions]]
rule = "B4"
paths = [
  "crates/lumen-index/src/ingest/application/engine_sm.rs",
  "crates/lumen-index/src/ingest/application/engine_sm/state_machine.rs",
  "crates/lumen-index/src/ingest/application/engine_sm/write_sink.rs",
]
subject = "index.application"
reason = "EngineSm is ingest's raft write path, the sibling of the write coordinator: it holds the shard's Arc<Engine>, reserves, prices, admits and applies each committed raft entry on it, and takes and restores the engine's raft snapshots; RaftWriteSink sizes each record with the Engine before it proposes it. It reaches the Engine's crate-private apply and admission API, so it stays in lumen-index rather than lumen-replication. The Engine uses ingest's change budget, so ingest does not list index in depends_on. P2: the apply port of the write coordinator exception above, which the Engine implements, serves both write paths."

[[exceptions]]
rule = "B4"
paths = ["crates/lumen-index/src/ingest/application/engine_sm.rs"]
subject = "persistence.application"
reason = "EngineSm owns the layer-capacity fallback (capacity::Fallback) that its checkpoints release, the same one the write coordinator holds. Persistence uses ingest's records, so ingest does not list persistence in depends_on. P2: persistence's application layer exposes snapshot capture, restore and capacity behind a port ingest defines."

# The save gate is compiled twice: once as the checkpoint store's child and
# once under the capacity worker, which must take the same gate type.

[[exceptions]]
rule = "B1"
paths = [
  "crates/lumen-index/src/persistence/application/capacity.rs",
  "crates/lumen-index/src/persistence/infrastructure/segment_rdb_store.rs",
]
subject = "#[path]"
reason = "segment_rdb_store.rs's mod save_gate and capacity.rs's mod publication_gate both read src/persistence/infrastructure/segment_save_gate.rs with #[path], so SaveGate and SavePermit are defined in both places (D7, E14). P2: the two become one module both sides share, and both #[path] lines go."

# The background merge moved to persistence/application as-is. It still

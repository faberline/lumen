# Lumen's bounded contexts and layers, checked by the workspace's
# rust-arch contract (scripts/meta/rust_arch_contract.py). The [policy] table
# is copied verbatim from the canonical policy.toml; everything after it is
# Lumen's own. See docs/architecture.md for what each context owns.
schema = 1

# Report only while the DDD split (P1) is in progress.
[migration]
enforce = false

[policy]
version = 1
size_warn = 400
size_error = 1000
root_md = [
  "README.md",
  "CONTRIBUTING.md",
  "LICENSE.md",
  "CHANGELOG.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "CLAUDE.md",
  "AGENTS.md",
  # Temporary: the current project docs contract requires these at the root.
  "STATUS.md",
  "ROADMAP.md",
]
docs_required = [
  "docs/README.md",
  "docs/architecture.md",
  "docs/glossary.md",
  "docs/domain/",
  "docs/adr/",
  "docs/operations/",
]
layers = ["domain", "application", "infrastructure", "interfaces"]
# The layer held to the [policy.domain] purity rules and kept free of other contexts.
domain_layer = "domain"
# Layers another context may use. A context without any of them exposes its whole public API.
public_layers = ["application"]
# <ctx>/domain/events(.rs|/) is the only domain module other contexts may use.
domain_events = "events"
# A tests/<name>.rs binary may stand alone only when it is the crate's single test
# target, contains one of these markers, or its leading //! block carries
# `//! isolation: <reason>`. Everything else lives in tests/it/.
test_isolation_markers = ["set_var(", "remove_var(", "#[global_allocator]"]
# tests/<dir>/ names holding .rs data (fixtures, trybuild cases), not test targets.
test_data_dirs = ["fixtures", "compile_fail", "ui"]
# false: one crate may hold several contexts (B3/B4 still guard each boundary).
# true: B1 requires every crate to belong to exactly one context.
one_context_per_crate = false

# Layers each layer may use inside one context. The shared kernel is usable by
# every layer; assembly code (lib.rs, main.rs, src/bin) is unrestricted. A
# multi-file binary is src/bin/<name>/main.rs plus sibling modules: B6 keeps
# the entry file thin and does not apply to those modules.
[policy.layer_deps]
domain = []
application = ["domain"]
infrastructure = ["domain"]
interfaces = ["application"]

[policy.domain]
# Applies to every domain layer, and to the shared kernel when shared_kernel_pure.
allowed_crates = [
  "std",
  "core",
  "alloc",
  "thiserror",
  "serde",
  "serde_json",
  "chrono",
  "time",
  "uuid",
  "sha2",
  "hex",
  "regex",
  "bytes",
]
denied_paths = [
  "std::fs",
  "std::net",
  "std::process",
  "std::env",
  "std::os",
  "std::io::stdin",
  "std::io::stdout",
  "std::io::stderr",
  "std::thread::spawn",
  "std::thread::sleep",
  "std::time::SystemTime::now",
  "std::time::Instant::now",
  "chrono::Utc::now",
  "chrono::Local::now",
  "chrono::offset::Utc::now",
  "chrono::offset::Local::now",
  "time::OffsetDateTime::now_utc",
  "time::OffsetDateTime::now_local",
  "time::Instant::now",
  "uuid::Uuid::now_v7",
  "uuid::Uuid::new_v4",
]
denied_macros = ["println", "print", "eprintln", "eprint", "dbg"]
shared_kernel_pure = true

[policy.naming]
crates_dir = "crates"
domain_crate = "{repo}-{context}-domain"
context_crate = "{repo}-{context}"
shared_kernel_crate = "{repo}-shared-kernel"

# Module layout (no mod.rs) is enforced by clippy, not by this checker.
[policy.lints.clippy]
mod_module_files = "deny"

# The vocabulary every context shares: the public API's wire types, the
# committed-mutation log entry, and the apply/capture barrier.
[shared_kernel]
path = "src/shared_kernel"

# Code that may use every context. `app` is the composition root (D1);
# `compat` keeps the module paths from before the split alive until outside
# callers move to the new ones (D3).
[assembly]
modules = ["src/app", "src/compat"]

[[contexts]]
name = "access"
depends_on = []
[contexts.layers]
domain = "src/access/domain"
application = "src/access/application"
infrastructure = "src/access/infrastructure"
interfaces = "src/access/interfaces"

[[contexts]]
name = "operator"
depends_on = ["access", "sharding"]
[contexts.layers]
domain = "src/operator/domain"
application = "src/operator/application"
infrastructure = "src/operator/infrastructure"

[[contexts]]
name = "sharding"
depends_on = ["index", "ingest"]
[contexts.layers]
domain = "src/sharding/domain"
application = "src/sharding/application"
infrastructure = "src/sharding/infrastructure"

[[contexts]]
name = "replication"
depends_on = ["index", "ingest", "persistence"]
[contexts.layers]
domain = "src/replication/domain"
application = "src/replication/application"

[[contexts]]
name = "ingest"
depends_on = []
[contexts.layers]
domain = "src/ingest/domain"
application = "src/ingest/application"
infrastructure = "src/ingest/infrastructure"

[[contexts]]
name = "persistence"
depends_on = ["index", "ingest"]
[contexts.layers]
domain = "src/persistence/domain"
application = "src/persistence/application"
infrastructure = "src/persistence/infrastructure"

[[contexts]]
name = "index"
depends_on = []
[contexts.layers]
domain = "src/index/domain"
application = "src/index/application"
infrastructure = "src/index/infrastructure"

# Layer-direction breaks the P1 split moves as-is (D2); P2 replaces each with a
# port the owning layer defines.

[[exceptions]]
rule = "B3"
paths = ["src/access/infrastructure/lumen_verifier.rs"]
subject = "infrastructure->application"
reason = "LumenVerifier implements service_auth::AsyncVerifier with Principal = AuthContext and is built from AuthConfig, both application types. P2: an application-side verifier port that the adapter implements."

[[exceptions]]
rule = "B3"
paths = ["src/access/interfaces/http.rs"]
subject = "interfaces->infrastructure"
reason = "auth_middleware is service_auth::async_auth_middleware instantiated at LumenVerifier, so the middleware names the adapter type. P2: instantiate it at the application-side verifier port instead."

[[exceptions]]
rule = "B3"
paths = [
  "src/operator/infrastructure/kube_hpa_control.rs",
  "src/operator/infrastructure/kube_auth_delegator_control.rs",
  "src/operator/infrastructure/kube_cluster_control.rs",
]
subject = "infrastructure->application"
reason = "Each Kube*Control adapter implements a control trait the application layer defines next to its only caller (HpaControl, AuthDelegatorControl, ClusterControl); kube_cluster_control also reuses reconcile's Prometheus text parser. P2: the traits move to the operator domain and the parser to the adapter."

[[exceptions]]
rule = "B3"
paths = [
  "src/operator/application/fleet_reconcile.rs",
  "src/operator/application/reconcile/loops.rs",
  "src/operator/application/reconcile/managed_service.rs",
  "src/operator/application/reshard_driver/driver_loop.rs",
]
subject = "application->infrastructure"
reason = "The leader-gated loops build their own Lease election and Kube*Control adapters, and ManagedService::apply builds KubeAuthDelegatorControl from the client it is handed. P2: the composition root builds the adapters and passes them in."

[[exceptions]]
rule = "B4"
paths = ["src/operator/application/render/identity.rs"]
subject = "access.domain"
reason = "control_plane_token() mounts the projected token at access's AUDIENCE, the value the verifier checks. P2: access exposes the control-plane token's audience through its application layer, next to CONTROL_PLANE_TOKEN_MOUNT."

[[exceptions]]
rule = "B4"
paths = [
  "src/operator/application/reshard_driver/catch_up_fenced.rs",
  "src/operator/application/reshard_driver/checkpoint.rs",
  "src/operator/application/reshard_driver/fence.rs",
  "src/operator/application/reshard_driver/migration.rs",
  "src/operator/application/reshard_driver/oversize.rs",
  "src/operator/application/reshard_driver/phases.rs",
  "src/operator/application/reshard_driver/transfer.rs",
  "src/operator/application/reshard_driver/trigger.rs",
]
subject = "sharding.domain"
reason = "The reshard driver plans and sizes each split with sharding's domain primitives: VirtualBucketShardMap, bucket_moves, snapshot_reshard_batches, snapshot_reshard_prune_chunks, ReshardBatch, ReshardPruneChunk and ADMIN_ROUTE_BODY_LIMIT_BYTES. P2: sharding's application layer exposes the split-planning API the driver calls."

[[exceptions]]
rule = "B4"
paths = ["src/operator/domain/lumen_spec/topology.rs"]
subject = "sharding.domain"
reason = "The CRD's shardMap.virtualBucketCount default is sharding's DEFAULT_VIRTUAL_BUCKET_COUNT, so the operator never renders a map the data plane reads differently. P2: the constant moves to the shared kernel."

[[exceptions]]
rule = "B3"
paths = ["src/sharding/infrastructure/routed_router/scatter.rs"]
subject = "infrastructure->application"
reason = "scatter_search merges the local and forwarded pages with search_fanout's merge_shard_search_responses and search_request_offset, the merge EngineShardSearch uses in-process, so both rank a scattered search the same way. P2: the merge moves to the sharding domain and both callers use it there."

# The Lumen and LumenFleet custom resources are the operator's domain model,
# and their Rust types are also the CRD schema (E1). P2 splits the schema into
# DTOs with a mapper; until then the domain names the crates the schema needs.

[[exceptions]]
rule = "B2"
paths = [
  "src/operator/domain/lumen_spec.rs",
  "src/operator/domain/lumen_fleet.rs",
]
subject = "kube"
reason = "E1: #[derive(CustomResource)] on Lumen and LumenFleet. P2: CRD DTOs outside the domain."

[[exceptions]]
rule = "B2"
paths = [
  "src/operator/domain/lumen_spec.rs",
  "src/operator/domain/lumen_spec/serving.rs",
  "src/operator/domain/lumen_spec/status.rs",
  "src/operator/domain/lumen_spec/topology.rs",
  "src/operator/domain/lumen_fleet.rs",
]
subject = "schemars"
reason = "E1: #[derive(JsonSchema)] on the CRD spec and status types, plus LumenFleet's hand-written preserve-unknown-fields schema. P2: CRD DTOs outside the domain."

[[exceptions]]
rule = "B2"
paths = ["src/operator/domain/lumen_spec/serving.rs"]
subject = "service_backup"
reason = "E1: ServingBackupSpec flattens the shared ScheduledBackupPolicy into the CRD, so spec.serving.backup's schema is the shared one. P2: the DTO keeps the flatten and the domain gets its own policy type."

[[exceptions]]
rule = "B2"
paths = ["src/operator/domain/lumen_spec/status.rs"]
subject = "service_k8s"
reason = "E1: LumenStatus.conditions is the shared metav1.Condition type every service's status projects to. P2: the DTO keeps the shared type and the domain gets its own condition facts."

[[exceptions]]
rule = "B2"
paths = ["src/operator/domain/lumen_fleet/plan.rs"]
subject = "serde_path_to_error"
reason = "plan() deserializes the merged per-namespace spec through serde_path_to_error so a rejection names the offending field. P2: the deserialization moves with the CRD DTOs."

# The sharding domain moved as-is (D2): its map constructors and reshard
# primitives report errors through anyhow, and the routing hash is CRC-32.

[[exceptions]]
rule = "B2"
paths = [
  "src/sharding/domain/bucket_move.rs",
  "src/sharding/domain/merge_delta.rs",
  "src/sharding/domain/prune_chunk.rs",
  "src/sharding/domain/reshard_batch.rs",
  "src/sharding/domain/snapshot_subset.rs",
  "src/sharding/domain/virtual_bucket_shard_map.rs",
]
subject = "anyhow"
reason = "The map constructors and the reshard primitives return anyhow::Result, which api.rs, storage.rs and the reshard driver propagate with ?. P2: a sharding domain error type (thiserror) that the callers convert."

[[exceptions]]
rule = "B2"
paths = ["src/sharding/domain/virtual_bucket_shard_map.rs"]
subject = "crc32fast"
reason = "route_hash is CRC-32 over the collection id and the routing key. Every stored document's bucket depends on it, so the algorithm is part of the routing contract and cannot change. P2: decide whether the domain may use crc32fast (pure, no I/O) or takes the hash from the shared kernel."

# The replication domain moved as-is (D2): it wraps raft_runtime's canonical
# cluster shapes for OpenAPI, and its constructors report errors through anyhow.

[[exceptions]]
rule = "B2"
paths = [
  "src/replication/domain/cluster_state_view.rs",
  "src/replication/domain/peer_addr.rs",
  "src/replication/domain/raft_role.rs",
]
subject = "utoipa"
reason = "E1: #[derive(ToSchema)] on ClusterStateView, PeerAddr and RaftRole, the /debug/cluster response that clients/openapi.json publishes. These wrappers exist so raft_runtime's shared types need not derive ToSchema. P2: OpenAPI DTOs outside the domain."

[[exceptions]]
rule = "B2"
paths = [
  "src/replication/domain/cluster_state.rs",
  "src/replication/domain/cluster_state_view.rs",
  "src/replication/domain/peer_addr.rs",
  "src/replication/domain/raft_role.rs",
]
subject = "raft_runtime"
reason = "ReadConsistency is raft_runtime's, re-exported; RaftRole, PeerAddr and ClusterStateView convert from raft_runtime's canonical shapes; RaftGroup::from_config takes peer ordinals and the LUMEN_PEERS override from raft_runtime::cluster, so the peers it lists match the ones the raft-wal wiring dials. P2: the conversions and the LUMEN_PEERS read move to an infrastructure adapter, and the domain decides whether raft_runtime's pure cluster types count as a shared kernel."

[[exceptions]]
rule = "B2"
paths = [
  "src/replication/domain/cluster_state.rs",
  "src/replication/domain/peer_addr.rs",
]
subject = "anyhow"
reason = "ClusterState::new and RaftGroup::from_config return anyhow::Result, which the bin's --wal raft setup wraps with .context() and propagates. P2: a replication domain error type (thiserror) that the callers convert."

# The shared kernel moved as-is (D2): the wire types carry their OpenAPI schema
# and report a malformed vector field through anyhow, and the capture barrier
# times how long it is held.

[[exceptions]]
rule = "B2"
paths = [
  "src/shared_kernel/types/api_error.rs",
  "src/shared_kernel/types/document.rs",
  "src/shared_kernel/types/query.rs",
  "src/shared_kernel/types/schema.rs",
  "src/shared_kernel/types/search.rs",
  "src/shared_kernel/types/stats.rs",
]
subject = "utoipa"
reason = "E1: #[derive(ToSchema)] on the public HTTP API's request and response types, which clients/openapi.json publishes. The engine uses the same types as its domain vocabulary. P2: OpenAPI DTOs outside the kernel, with mappers; their serde is also the RDB, AOF and WAL CBOR format, so the wire bytes must stay identical."

[[exceptions]]
rule = "B2"
paths = ["src/shared_kernel/types/schema.rs"]
subject = "anyhow"
reason = "FieldSpec::vector_spec returns anyhow::Result, which storage.rs and segment_rdb.rs propagate with ?. P2: a kernel error type (thiserror) that the callers convert."

[[exceptions]]
rule = "B2"
paths = ["src/shared_kernel/capture_barrier.rs"]
subject = "std::time::Instant::now"
reason = "E4: CaptureBarrier times how long each apply record and each capture holds it (HoldTiming); only its own tests read the timing today. P2: a Clock port, as for the index context's clock reads."

# The ingest domain moved as-is (D2): the change budget wakes its async waiters
# through tokio and bounds its blocking wait with the clock.

[[exceptions]]
rule = "B2"
paths = [
  "src/ingest/domain/change_budget.rs",
  "src/ingest/domain/change_budget/budget.rs",
  "src/ingest/domain/change_budget/budget_wake.rs",
]
subject = "tokio"
reason = "BudgetWake keeps a tokio::sync::Notify beside its Condvar, so the async checkpoint driver and async admissions wait for a budget change without holding a blocking thread; wait_for_change_async bounds that wait with tokio::time::timeout. P2: a wake port the domain signals, with the Condvar and the Notify behind it in infrastructure."

[[exceptions]]
rule = "B2"
paths = ["src/ingest/domain/change_budget/budget_wake.rs"]
subject = "std::time::Instant::now"
reason = "E4: wait_for_change_timeout turns its timeout into a deadline and re-reads the clock after each spurious Condvar wake. P2: a Clock port, or the wait moves to infrastructure with the wake port."

# WalLog, the log seam writes publish through, moved to the ingest domain as-is
# (D2); its signature still names the runtime types it was written against.

[[exceptions]]
rule = "B2"
paths = ["src/ingest/domain/wal_log.rs"]
subject = "anyhow"
reason = "WalLog's methods return anyhow::Result, the error type MemWal, the raft write sink and the apply loop already share. P2: a WAL error type in the domain that the backends map into, or the error type moves with the port."

[[exceptions]]
rule = "B2"
paths = ["src/ingest/domain/wal_log.rs"]
subject = "async_trait"
reason = "WalLog is an async trait held as Arc<dyn WalLog> (SharedWal), so its methods are boxed with #[async_trait] to stay object-safe. P2: decided with where WalLog lives (see the domain->infrastructure exception below)."

[[exceptions]]
rule = "B2"
paths = ["src/ingest/domain/wal_log.rs"]
subject = "futures"
reason = "WalStream and WalAdmissionStream are boxed futures::Stream subscriptions, and subscribe_admitted's default maps the resident stream with StreamExt. P2: the stream types move with WalLog (see the domain->infrastructure exception below)."

[[exceptions]]
rule = "B3"
paths = ["src/ingest/domain/wal_log.rs"]
subject = "domain->infrastructure"
reason = "Only WalLog's signature references the delivery types: WalAdmissionStream yields WalDelivery and stage_source returns WalSourceRelease. They stay in infrastructure beside MemWal because WalSourceRecord holds MemWal's private slot and WalDelivery hands out mmap payloads. P2 chooses between a delivery handle trait the domain defines and infrastructure implements, or moving WalLog to ingest/application/ports."

# Durable staging stays in ingest/infrastructure; three of its types still
# appear in domain signatures.

[[exceptions]]
rule = "B3"
paths = [
  "src/ingest/domain/change_admission.rs",
  "src/ingest/domain/change_admission/tests.rs",
  "src/ingest/domain/change_budget.rs",
  "src/ingest/domain/change_budget/reservation.rs",
]
subject = "domain->infrastructure"
reason = "SourceIdentity is carried by RamCharge and Reservation::commit_ram, and change_admission's staging bridge stages into a StageStore and holds the DurableStage it returns. SourceIdentity and SourceKind stay in infrastructure beside the marker encoding because SourceIdentity::new and SourceKind::decode return io::Result and the marker reads their private fields. P2: change that error type, move SourceIdentity and SourceKind into the ingest domain, and have the staging bridge depend on a stage-store port the domain defines."

# The write coordinator moved to ingest/application as-is; it still holds and
# parses WAL types that stay in infrastructure.

[[exceptions]]
rule = "B3"
paths = [
  "src/ingest/application/write_coordinator.rs",
  "src/ingest/application/write_coordinator/committed_scalar.rs",
]
subject = "application->infrastructure"
reason = "PendingApply and MappedApply hold the WalDelivery the log handed the apply loop, and the committed scalar path parses the pinned payload with FastIndexScanner before it applies. Both stay in ingest/infrastructure/wal beside MemWal (see the wal_log exception above). P2: the delivery handle trait decided there, and scanning behind a port the application layer defines."

# Replication's raft state machine admits and frames records with ingest's own
# domain and WAL code. Now that ingest has an application layer, those uses
# cross into layers other contexts may not use.

[[exceptions]]
rule = "B4"
paths = [
  "src/replication/application/engine_sm.rs",
  "src/replication/application/engine_sm/state_machine.rs",
  "src/replication/application/engine_sm/write_sink.rs",
]
subject = "ingest.domain"
reason = "EngineSm admits each raft command against the change budget (it matches AdmissionError::Full and sizes against HARD_LIMIT), maps a refusal before publication to PendingChangeCapacity, and RaftWriteSink wraps each entry in a WalRecord before it proposes it. P2: ingest's application layer exposes the admission and record API both write paths call."

[[exceptions]]
rule = "B4"
paths = [
  "src/replication/application/engine_sm.rs",
  "src/replication/application/engine_sm/state_machine.rs",
]
subject = "ingest.infrastructure"
reason = "EngineSm bounds a raft command's decode workspace with wire_cost::scan_workspace_bytes and applies a retained oversized fast-Index command through FastIndexScanner, the same bound and scanner the WAL path uses. P2: ingest's application layer exposes both."

# The save gate is compiled twice: once as the checkpoint store's child and
# once under the capacity worker, which must take the same gate type.

[[exceptions]]
rule = "B1"
paths = [
  "src/persistence/application/capacity.rs",
  "src/persistence/infrastructure/segment_rdb_store.rs",
]
subject = "#[path]"
reason = "segment_rdb_store.rs's mod save_gate and capacity.rs's mod publication_gate both read src/persistence/infrastructure/segment_save_gate.rs with #[path], so SaveGate and SavePermit are defined in both places (D7, E14). P2: the two become one module both sides share, and both #[path] lines go."

# The background merge moved to persistence/application as-is. It still
# extends SegmentRdbStore and drives the store's staging helpers, and the
# store, in turn, holds the merge scheduler and asks it for merges.

[[exceptions]]
rule = "B3"
paths = [
  "src/persistence/application/background_merge.rs",
  "src/persistence/application/background_merge/link.rs",
  "src/persistence/application/background_merge/publish.rs",
]
subject = "application->infrastructure"
reason = "The merge requests are methods on SegmentRdbStore, a Job carries the store, and merge_one stages, validates and publishes a generation with the store's manifest, layout and compaction helpers. request_merge enqueues on the worker queue in merge_worker. P2: the application layer defines a generation-store port the store implements, and the worker queue sits behind it."

[[exceptions]]
rule = "B3"
paths = [
  "src/persistence/infrastructure/merge_worker.rs",
  "src/persistence/infrastructure/segment_rdb_store.rs",
  "src/persistence/infrastructure/segment_rdb_store/diagnostic.rs",
  "src/persistence/infrastructure/segment_rdb_store/save.rs",
  "src/persistence/infrastructure/segment_rdb_store/save_attempt.rs",
]
subject = "infrastructure->application"
reason = "SegmentRdbStore holds its root's RootWork scheduler, a save waits on it for capacity (CapacityWait) and asks needs_merge before it requests a merge, and the merge worker runs merge_one on each Job it dequeues. The statics stay in infrastructure (E17). P2: the scheduler state becomes the port's implementation detail and the worker calls the application through that port."

# The capacity worker and the durable restore moved to persistence/application
# as-is. Both hold a SegmentRdbStore, and the store and the AOF replay, in
# turn, hold the worker's publication fence, frozen window and fallback.

[[exceptions]]
rule = "B3"
paths = [
  "src/persistence/application/capacity.rs",
  "src/persistence/application/restore.rs",
]
subject = "application->infrastructure"
reason = "A capacity Fallback keeps the SegmentRdbStore its checkpoint sink writes to (the configured store, or a temporary spill store) alive for the owner's lifetime, and append_limit reserves against composed_segment's MAX_INCREMENTAL_LAYERS. SegmentRestoreSink saves the restored engine into its SegmentRdbStore, reloads the current generation and prunes old ones. P2: the application layer defines a generation-store port the store implements (see the background merge exception above)."

[[exceptions]]
rule = "B3"
paths = [
  "src/persistence/infrastructure/aof/replay.rs",
  "src/persistence/infrastructure/segment_rdb_store.rs",
  "src/persistence/infrastructure/segment_rdb_store/open.rs",
]
subject = "infrastructure->application"
reason = "The store publishes CURRENT only through the capacity worker's PublicationFence, which with_publication_fence installs, and a pending frozen checkpoint holds a FrozenWindow so capacity keeps a catalog slot for its delta. AOF replay ensures a capacity Fallback before any admission can wait, so a replay blocked on change-budget capacity has a worker to checkpoint and merge. P2: the fence and window move to persistence's domain, and replay takes a capacity-owner port the application layer implements."

[[exceptions]]
rule = "B4"
paths = ["src/persistence/application/capacity/worker.rs"]
subject = "ingest.domain"
reason = "The budget relay sleeps on the change budget's BudgetWake and turns each capacity wait it observes into checkpoint or merge work on the owner's endpoint. P2: ingest's application layer exposes the budget wake, as it will the budget snapshot the checkpoint diagnostic reads."

# The segment checkpoint sink moved to persistence/application as-is, and its
# periodic schedule to persistence/domain. The sink and its driver still hold
# the store, the checkpoint diagnostic and the process state infrastructure
# keeps, and both the sink and the schedule read ingest's change budget.

[[exceptions]]
rule = "B3"
paths = [
  "src/persistence/application/segment_checkpoint_sink.rs",
  "src/persistence/application/segment_checkpoint_sink/driver.rs",
  "src/persistence/application/segment_checkpoint_sink/hnsw_cache.rs",
  "src/persistence/application/segment_checkpoint_sink/pending_spill.rs",
]
subject = "application->infrastructure"
reason = "SegmentCheckpointSink checkpoints into, prunes and writes the HNSW graph caches of the SegmentRdbStore it holds, and a manual or periodic attempt numbers its CheckpointDiagnosticContext from NEXT_CHECKPOINT_ATTEMPT_ID (the driver's tests pass a DiagnosticCaptureToken). The HNSW cache seal records and checks its marker in HNSW_CACHE_SEALS, and PendingChangeSpill opens a SegmentRdbStore over a SpillDirectory it keeps alive. The statics stay in infrastructure (E17). P2: the generation-store port the background merge exception names, with the diagnostic context and the process state behind it."


# The Engine moved to index/application as-is, split by use case, with the
# checkpoint capture, the frozen checkpoint, the live deltas and the recovery
# profile, and EngineState moved to index/domain. The Engine still takes
# ingest's change budget and journal, runs the checkpoint protocol on
# persistence's segment files and applies sharding's reshard formats, and
# ingest's write path still calls it directly.

[[exceptions]]
rule = "B2"
paths = ["src/index/domain/engine_state.rs"]
subject = "anyhow"
reason = "EngineState::allocate_collection_generation reports an exhausted generation counter with anyhow!, which the Engine's create, truncate, checkpoint, reopen, restore and reshard paths propagate with ?. P2: a variant of the index domain error type (with Collection's, see the anyhow exceptions above)."

[[exceptions]]
rule = "B3"
paths = [
  "src/index/domain/collection.rs",
  "src/index/domain/collection/checkpoint.rs",
]
subject = "domain->application"
reason = "Collection journals its dirty rows as a ChangeJournal<CheckpointValue>, and checkpoint_value reads a row back as one. CheckpointValue moved with the checkpoint capture, which freezes the journal, and a file-backed scalar row holds persistence's SegmentReader. P2: CheckpointValue moves to the index domain beside the Collection, its file-backed row read through the sealed-segment reader port (see the persistence.infrastructure exceptions above)."

[[exceptions]]
rule = "B3"
paths = ["src/index/domain/collection/segments.rs"]
subject = "domain->application"
reason = "open_from_segments_with_vectors records each vector field's open and each field's coverage rebuild in the RecoveryProfile the Engine's reopen passes down. P2: the reopen reports those timings to a recovery observer the index domain defines and RecoveryProfile implements."

[[exceptions]]
rule = "B4"
paths = [
  "src/index/application/checkpoint_capture.rs",
  "src/index/application/engine/checkpoint_flush.rs",
  "src/index/application/engine/cost.rs",
  "src/index/application/engine/delete.rs",
  "src/index/application/engine/index.rs",
  "src/index/application/engine/raft_dispatch.rs",
  "src/index/application/engine/replace.rs",
  "src/index/application/engine/replace/one_doc.rs",
]
subject = "ingest.domain"
reason = "The index, replace and delete paths and the Raft dispatch take the change budget's RetainedCharge for the record they apply, the checkpoint capture holds each collection's frozen journal as FrozenChanges and the flush shares captured values as SharedValue, and the cost context implements change_record_cost's CostContext and prices an entry with estimate_record_or_retain and estimate_record_exact_default_ngram. P2: with the Collection's journal (see the ingest.domain exception above), the budget, journal and pricing sit behind ingest application ports the Engine is given."

[[exceptions]]
rule = "B4"
paths = ["src/index/application/engine.rs"]
subject = "persistence.application"
reason = "The Engine holds persistence's capacity Registry as layer_maintenance: the committed apply reads its append limit and maintenance owner before it adds an incremental scalar layer, and the capacity worker reads the owner back through the Engine. P2: a layer-maintenance port in the index application layer that the capacity registry implements and the composition root passes in."

[[exceptions]]
rule = "B4"
paths = [
  "src/index/application/checkpoint_capture.rs",
  "src/index/application/engine.rs",
  "src/index/application/engine/checkpoint_delta.rs",
  "src/index/application/engine/checkpoint_freeze.rs",
  "src/index/application/frozen_checkpoint.rs",
  "src/index/application/live_base.rs",
  "src/index/application/live_delta.rs",
]
subject = "persistence.infrastructure"
reason = "The checkpoint protocol runs on persistence's segment files: the capture pins delta and base SegmentReaders and the composed segment's scalar cut, publication and replacement, recovery attaches a delta SegmentReader, the frozen checkpoint writes the external-id and vector sidecars with eid_writer and vector_writer and reopens them with SegmentReader::open, the live base and deltas install ComposedSegmentReaders, and the Engine keeps the segment store's CheckpointRootGuards until its readers drop. P2: the sealed-segment reader and segment writer ports in the index domain (see the persistence.infrastructure exceptions above), and a checkpoint-root lease the segment store hands the Engine as an opaque guard."

[[exceptions]]
rule = "B4"
paths = [
  "src/index/application/engine/reshard_apply.rs",
  "src/index/application/engine/reshard_prune.rs",
]
subject = "sharding.domain"
reason = "The reshard verbs apply sharding's wire formats: apply_reshard_batch merges a batch with merge_snapshot_delta under its ReshardBatchReplaceScope and checks the scope against a balanced VirtualBucketShardMap, evict_not_owned drops the documents a newer VirtualBucketShardMap assigns elsewhere, and the prune accumulates ReshardPruneChunks. P2: the reshard batch, replace scope, prune chunk and bucket map move to the shared kernel, which sharding and index both read."

[[exceptions]]
rule = "B4"
paths = [
  "src/ingest/application/write_coordinator.rs",
  "src/ingest/application/write_coordinator/apply_loop.rs",
  "src/ingest/application/write_coordinator/local_record.rs",
  "src/ingest/application/write_coordinator/submit.rs",
  "src/ingest/infrastructure/wal/delivery.rs",
  "src/ingest/infrastructure/wal_source_stage.rs",
]
subject = "index.application"
reason = "The write coordinator holds the shard's Arc<Engine>: its apply loop reserves, admits and applies each committed record on it and hands each waiter the ApplyOutcome, and a local submit sizes its record with Engine::record_owned_bytes; WAL delivery sizes records the same way, and the source stage bounds a decode with Engine::record_decode_peak. The Engine uses ingest's change budget and journal (see the ingest.domain exceptions above), so ingest does not list index in depends_on. P2: ingest's application layer defines an apply port (size, admit and apply a committed record) that the Engine implements and the composition root passes in, which removes the cycle."

# The committed apply path moved to index/application/apply as-is: the
# fast-Index and replacement planners, their apply adapters, the borrowed Text
# apply and the record dispatch boundary. It reads a retained record in place
# with ingest's WAL scanners, reserves and prices against ingest's change
# budget, and stages scalar rows on persistence's composed segments.

[[exceptions]]
rule = "B4"
paths = [
  "src/index/application/apply/committed_index_apply.rs",
  "src/index/application/apply/committed_index_apply/fields.rs",
  "src/index/application/apply/committed_index_plan.rs",
  "src/index/application/apply/committed_index_plan/pass.rs",
  "src/index/application/apply/committed_replace_apply.rs",
  "src/index/application/apply/committed_replace_plan.rs",
  "src/index/application/apply/committed_replace_plan/pass.rs",
  "src/index/application/apply/committed_replace_plan/source_value.rs",
  "src/index/application/apply/committed_replace_view.rs",
  "src/index/application/apply/committed_text_apply.rs",
]
subject = "ingest.infrastructure"
reason = "The committed apply reads a retained record's wire image without decoding it: the fast-Index planners, the field and Text apply and the replace view walk it with FastIndexScanner and borrow its FastIndexValues and FastStringLists, and a replacement is scanned with BorrowedReplaceScanner and staged in a BorrowedReplaceSpool, whose BorrowedReplaceSpoolDoc is the planner's ReplaceDocDescriptor. P2: ingest's application layer exposes the borrowed scanners and spool, as it does for EngineSm and replay (see the ingest.infrastructure exceptions above)."

[[exceptions]]
rule = "B4"
paths = [
  "src/index/application/apply/committed_index_apply.rs",
  "src/index/application/apply/committed_index_apply/fields.rs",
  "src/index/application/apply/committed_replace_apply.rs",
  "src/index/application/apply/committed_text_apply.rs",
  "src/index/application/apply/record_apply.rs",
]
subject = "ingest.domain"
reason = "The field and replacement apply wait for record RAM when the change budget refuses with AdmissionError::Full, the field apply replaces a vector cell's charged journal row and holds the old change_journal::Row until the apply lease ends, the Text apply prices its record with RecordEstimate, and a direct record apply maps a capacity refusal before publication to PendingChangeCapacity. P2: with the Engine's (see the ingest.domain exceptions above), the budget, journal and pricing sit behind ingest application ports the Engine is given."

[[exceptions]]
rule = "B4"
paths = [
  "src/index/application/apply/committed_index_apply.rs",
  "src/index/application/apply/committed_index_apply/fields.rs",
]
subject = "persistence.infrastructure"
reason = "The field apply stages a scalar field's winning rows as a private delta over its ComposedSegmentReader (with_private_delta, or from_private_empty_base when the field has no segment yet) and keeps the before and after readers in its FieldPlan until publication. P2: the sealed-segment reader port in the index domain (see the persistence.infrastructure exceptions above)."

[[exceptions]]
rule = "B4"
paths = ["src/index/application/apply/committed_index_apply/fields.rs"]
subject = "persistence.application"
reason = "Before it adds an incremental scalar layer, the field apply compares the composed segment's layer count with layer_maintenance's append limit and names the capacity Work, Checkpoint or Merge, that the maintenance owner must finish first. P2: the layer-maintenance port the Engine is given (see the persistence.application exception above) takes the work kind as its own type."

# Record admission and Text preparation moved to index/application as-is:
# the Engine's record reservation, pricing, capacity and admitted-record
# steps, the record charge journal, and the owned and borrowed Text staging
# before the apply lease. They reserve, price and retain against ingest's
# change budget, read a borrowed record with ingest's FastIndexScanner, and
# ingest's pending-capacity error reads their RecordAdmissionError back.

[[exceptions]]
rule = "B3"
paths = [
  "src/index/application/text_preparation.rs",
  "src/index/application/text_preparation/staging.rs",
]
subject = "application->infrastructure"
reason = "Text preparation stages each value with staged_text_row's StagedTextRow::stage_charged, growing its reservation by each StageAllocation (reader or workspace bytes) the stage asks for, keeps the StagedTextRows it prepared for the apply, and caps a long token's source bound at large_text_row's LARGE_TOKEN_SOURCE_BYTES. With the jieba feature, a Jieba Text value's preparation bound adds jieba_disk_route's ROUTE_CACHE_BYTES, the dictionary route cache the disk-backed segmenter keeps while it stages the value. P2: staging goes through the staged-row port (see the application->infrastructure exception below), and the tokenizer port in the index domain (see the index_text exception above) reports its route cache bytes, which jieba_disk_route implements."

[[exceptions]]
rule = "B4"
paths = [
  "src/index/application/admission.rs",
  "src/index/application/admission/admitted_record.rs",
  "src/index/application/admission/capacity.rs",
  "src/index/application/admission/engine_admission.rs",
  "src/index/application/admission/pricing.rs",
  "src/index/application/admission/record_charges.rs",
  "src/index/application/admission/record_reservation.rs",
  "src/index/application/text_preparation/staging.rs",
]
subject = "ingest.domain"
reason = "Admission reserves each record against the change budget: EngineChanges holds the ChangeBudget and its Owner, a RecordReservation wraps a budget Reservation and reports AdmissionError, SourceRetention and HARD_LIMIT, the record charge journal keeps each applied record's RetainedCharge until a checkpoint freezes it with the budget's FrozenBatch, the capacity helpers expose the owner's capacity state and BudgetWake, pricing uses RecordEstimate and the default n-gram cost workspace, a context-dependent price reports NormalizeError, and Text staging prices with estimate_record_prepared_text. P2: with the Engine's (see the ingest.domain exceptions above), the budget, journal and pricing sit behind ingest application ports the Engine is given."

[[exceptions]]
rule = "B4"
paths = [
  "src/index/application/text_preparation.rs",
  "src/index/application/text_preparation/borrowed.rs",
]
subject = "ingest.infrastructure"
reason = "Borrowed Text preparation walks a retained record in place with FastIndexScanner and stages each FastIndexValue's Text before the apply lease, and the metadata bounds the committed apply reserves are read from the same scanner. P2: ingest's application layer exposes the borrowed scanner, as it does for the committed apply (see the ingest.infrastructure exception above)."

[[exceptions]]
rule = "B4"
paths = ["src/index/application/text_preparation/staging.rs"]
subject = "persistence.infrastructure"
reason = "Staging a Text row retries with a larger workspace when text_row_stage refuses with RequiredTextRowWorkspace, whose required_bytes the reservation grows to. P2: the segment writer port in the index domain (see the persistence.infrastructure exceptions above) reports the workspace a row needs as an error type the index domain defines."

[[exceptions]]
rule = "B4"
paths = ["src/ingest/domain/change_admission.rs"]
subject = "index.application"
reason = "PendingChangeCapacity::from_record_prepublication maps the Engine's RecordAdmissionError, a Capacity or Overflow refusal before publication, to the pending-capacity error the write coordinator and EngineSm return. The Engine uses ingest's change budget (see the ingest.domain exceptions above), so ingest does not list index in depends_on. P2: the apply port ingest defines (see the index.application exception above) reports admission refusals with its own error type, which the Engine's adapter maps RecordAdmissionError onto."

# The index's file-backed rows moved to index/infrastructure as-is: the Text
# and Vector rows staged before apply, the scalar files prepared from a
# committed record, and the checkpoint projections that write the journal's
# rows as segments. The index domain and application hold the staged rows
# and call the projections, the projections read the journal's
# CheckpointValue, and every row is a persistence segment. field_deltas.rs
# called the projections through storage.rs, which the checker did not see.

[[exceptions]]
rule = "B3"
paths = [
  "src/index/application/apply.rs",
  "src/index/application/apply/committed_index_apply.rs",
  "src/index/application/apply/committed_index_apply/fields.rs",
  "src/index/application/checkpoint_capture.rs",
]
subject = "application->infrastructure"
reason = "The committed apply works on rows it staged before the apply lease: apply_value takes a prepared StagedTextRow, the index plan keeps each planned Text cell's StagedTextRow and each vector's raw and canonical StagedVectorRow, and the field apply stages a vector with StagedVectorRow::stage, bounds its reader metadata, and prepares a scalar field's winning rows with committed_scalar_files::prepare_validated_fields. CheckpointValue's StagedText and StagedVector variants journal the staged rows until a checkpoint writes them. P2: a staged-row port in the index domain (a Text row's terms, postings and document length, a Vector row's aligned slice, and the scalar file's reader) that index/infrastructure implements, handed to the Engine at construction."

[[exceptions]]
rule = "B3"
paths = [
  "src/index/domain/field_index/seal.rs",
  "src/index/domain/text_index.rs",
  "src/index/domain/text_index/terms.rs",
]
subject = "domain->infrastructure"
reason = "TextIndex keeps each prepared row's StagedTextRow in staged_rows until the next checkpoint and folds their terms and postings into its reads, its term count falls back to text_projection::live_term_count when a staged row cannot list its terms, and the field seal writes a Text field's live postings with text_projection::write_live. P2: TextIndex holds its staged rows as the staged-row port (see the application->infrastructure exception above), and the seal and term count go through the text-segment writer port (see the index.domain exception on text_writer above)."

[[exceptions]]
rule = "B3"
paths = [
  "src/index/infrastructure/checkpoint_projection/scalar_projection.rs",
  "src/index/infrastructure/checkpoint_projection/text_projection.rs",
  "src/index/infrastructure/checkpoint_projection/text_projection/rows.rs",
  "src/index/infrastructure/committed_scalar_files.rs",
]
subject = "infrastructure->application"
reason = "The checkpoint projections read each journal row as the checkpoint capture's CheckpointValue (an owned value, a StagedText or StagedVector row, or a file-backed scalar row), and committed_scalar_files refuses an unvalidated field with more items than the Engine's MAX_INDEX_ITEMS. P2: CheckpointValue moves to the index domain beside the Collection (see the domain->application exception above), and MAX_INDEX_ITEMS becomes an index domain limit the Engine and the scalar files share."

[[exceptions]]
rule = "B4"
paths = [
  "src/index/infrastructure/checkpoint_projection/scalar_projection.rs",
  "src/index/infrastructure/checkpoint_projection/scalar_projection/merge.rs",
  "src/index/infrastructure/checkpoint_projection/text_projection.rs",
  "src/index/infrastructure/checkpoint_projection/text_projection/rows.rs",
  "src/index/infrastructure/committed_scalar_files.rs",
  "src/index/infrastructure/committed_scalar_files/selected.rs",
  "src/index/infrastructure/staging/large_text_row.rs",
  "src/index/infrastructure/staging/large_text_row/one_row.rs",
  "src/index/infrastructure/staging/staged_text_row.rs",
]
subject = "persistence.infrastructure"
reason = "Every file-backed row is a persistence segment: the checkpoint projections and the committed scalar files lend their rows to the segment stream writers (the keyword, number, set and Text projections, with ScalarProjectionScratch) and read staged dictionaries and postings through SegmentReader, a staged Text row is a one-row segment text_row_stage writes (the long-token path through write_text_projection) and SegmentReader maps, and the scalar files open their private output with SegmentReader::open_owned_stage. P2: the segment writer and sealed-segment reader ports in the index domain (see the persistence.infrastructure exceptions above), which the persistence segment implements and index/infrastructure is handed."

[[exceptions]]
rule = "B4"
paths = [
  "src/index/infrastructure/checkpoint_projection/scalar_projection.rs",
  "src/index/infrastructure/checkpoint_projection/text_projection.rs",
  "src/index/infrastructure/checkpoint_projection/text_projection/rows.rs",
]
subject = "ingest.domain"
reason = "write_checkpoint_rows takes the checkpoint's rows as the change journal's SharedValue<CheckpointValue>, the values the capture froze and the flush shares. P2: with the Collection's journal (see the ingest.domain exceptions above), the journal's value handle sits behind an ingest application port or moves to shared_kernel."

[[exceptions]]
rule = "B4"
paths = [
  "src/index/infrastructure/committed_scalar_files.rs",
  "src/index/infrastructure/committed_scalar_files/selected.rs",
]
subject = "ingest.infrastructure"
reason = "The committed scalar files read a field's winning items in place from the retained record with FastIndexScanner and lend its FastIndexItems and FastIndexValues to the segment writer, so no field is decoded. P2: ingest's application layer exposes the borrowed scanner, as it does for the committed apply (see the ingest.infrastructure exceptions above)."

[[exceptions]]
rule = "B4"
paths = ["src/persistence/infrastructure/segment_rdb_store/field_deltas.rs"]
subject = "index.infrastructure"
reason = "A Keyword, Number or Set field delta is written from the checkpoint rows with scalar_projection::write_checkpoint_rows and a Text delta with text_projection::write_checkpoint_rows, so a staged row is copied from its reader rather than rehydrated. Both were storage.rs re-exports (write_scalar_checkpoint_rows, write_text_checkpoint_rows) until this move. P2: the checkpoint sink writes a delta through a checkpoint-projection port the index domain defines, which index/infrastructure implements and the Engine hands the sink."

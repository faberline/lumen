]
subject = "application->infrastructure"
reason = "The checkpoint protocol lays out the checkpoint directory itself: the flush and the frozen checkpoint write each collection under its collection_dir_name, hard-link an unchanged collection's origin with hard_link_checkpoint_tree, and write the CheckpointSchema sidecar (CHECKPOINT_SCHEMA_FILE, with its CheckpointLayout) after checkpoint_write_boundary; the freeze and the origin binding record a collection's lineage and origin under the same directory name, and the reopen reads each sidecar back and decodes the collection's name with collection_name_from_dir. P2: a checkpoint-directory port in the index domain (the sidecar, the field layout and the collection directory names) that checkpoint_fs implements, handed to the Engine at construction."

[[exceptions]]
rule = "B3"
paths = [
  "crates/lumen-index/src/index/application/engine/reshard_apply.rs",
  "crates/lumen-index/src/index/application/engine/reshard_prune.rs",
  "crates/lumen-index/src/index/application/engine/restore.rs",
]
subject = "application->infrastructure"
reason = "The Engine's snapshot, restore and reshard verbs speak the snapshot document: snapshot builds a SnapshotV1 stamped with SNAPSHOT_VERSION and restore refuses any version it does not know, apply_reshard_batch checks and merges a batch's SnapshotV1 delta, and the prune applies an empty one. P2: the snapshot document becomes a published language in shared_kernel (the versioned wire types index, persistence, sharding and the operator exchange), and snapshot_v1 keeps only its encoding."

[[exceptions]]
rule = "B3"
paths = ["crates/lumen-index/src/index/application/engine/delete.rs"]
subject = "application->infrastructure"
reason = "docs:truncate hands the detached Collection to the process-wide retirement worker (collection_retirement_worker, retire_collection_with), which reclaims it off the apply thread; truncate_docs_with_retirement takes the CollectionRetirementWorker so a test can pass an unavailable one. P2: a retirement port in the index application layer (retire a detached Collection) that collection_retirement implements and the composition root injects into the Engine."

[[exceptions]]
rule = "B3"
paths = [
  "crates/lumen-index/src/index/domain/collection/snapshot.rs",
  "crates/lumen-index/src/index/domain/field_index/snapshot.rs",
]
subject = "domain->infrastructure"
reason = "Collection::to_snapshot and from_snapshot map a collection to and from the snapshot document's CollectionSnapshot, and each FieldIndex to and from its FieldIndexSnapshot, writing the LegacyInvertedIndex placeholder a v1 reader expects. P2: the snapshot document moves to shared_kernel (see the application->infrastructure exception on reshard_apply above), or the mapping moves to snapshot_v1 over the domain's accessors."

[[exceptions]]
rule = "B3"
paths = ["crates/lumen-index/src/index/domain/collection/segments.rs"]
subject = "domain->infrastructure"
reason = "seal_to_segments_with_layout writes each field's segments under the CheckpointLayout's field stem (Legacy or Encoded), and open_from_segments_with_vectors reads them back with the layout the sidecar names. P2: the layout is a value of the checkpoint-directory port in the index domain (see the application->infrastructure exception on checkpoint_flush above)."

[[exceptions]]
rule = "B4"
paths = [
  "crates/lumen-index/src/sharding/domain/merge_delta.rs",
  "crates/lumen-index/src/sharding/domain/prune_chunk.rs",
  "crates/lumen-index/src/sharding/domain/reshard_batch.rs",
  "crates/lumen-index/src/sharding/domain/snapshot_subset.rs",
  "crates/lumen-index/src/sharding/interfaces/http/reshard.rs",
]
subject = "index.infrastructure"
reason = "The reshard formats are cut from and merged into the snapshot document: snapshot_subset takes a bucket's documents out of a SnapshotV1's CollectionSnapshots and FieldIndexSnapshots, a ReshardBatch carries the subset, merge_snapshot_delta merges a delta's collections and field indexes into the base, a prune chunk is planned against a SnapshotV1, and /admin/backup:scoped answers with the subset as a SnapshotV1. P2: the snapshot document becomes a published language in shared_kernel (see the index application->infrastructure exception on reshard_apply above), which sharding reads without depending on index."

[[exceptions]]
rule = "B4"
paths = ["crates/lumen-index/src/sharding/infrastructure/routed_router.rs"]
subject = "index.infrastructure"
reason = "RoutedRouter runs its local search legs on BlockingSearchExecutor, the index's bounded bridge to blocking threads, so a routed pod's legs and its HTTP handlers draw on the one process-wide permit pool rather than each router adding its own. P2: the executor becomes an index application port (run a blocking search under the shared bound) that index/infrastructure implements and the composition root passes to both the app state and the router."

[[exceptions]]
rule = "B4"
paths = ["crates/lumen-operator/src/application/reshard_driver/transfer.rs"]
subject = "index.infrastructure"
reason = "The reshard driver fetches a source shard's scoped backup from /admin/backup:scoped and decodes the response as a SnapshotV1 before it cuts the batches. P2: the snapshot document in shared_kernel (see the sharding.domain exception above)."

[[exceptions]]
rule = "B4"
paths = [
  "crates/lumen-index/src/persistence/application/ports/restore_sink.rs",
  "crates/lumen-index/src/persistence/application/restore.rs",
  "crates/lumen-index/src/persistence/infrastructure/rdb.rs",
  "crates/lumen-index/src/persistence/interfaces/http/backup.rs",
]
subject = "index.infrastructure"
reason = "The RDB file is an encoded RdbSnapshot, a SnapshotV1 with the WAL sequence it is current as of, /admin/backup answers with the engine's SnapshotV1, and RestoreSink and the restore sinks that implement it take the SnapshotV1 that /admin/restore decoded. P2: EngineSnapshotRepository (see the domain->infrastructure exception on rdb_store above), with the snapshot document in shared_kernel."

[[exceptions]]
rule = "B4"
paths = [
  "crates/lumen-index/src/persistence/infrastructure/segment_rdb_store/catalog.rs",
  "crates/lumen-index/src/persistence/infrastructure/segment_rdb_store/compaction.rs",
  "crates/lumen-index/src/persistence/infrastructure/segment_rdb_store/flat_layout.rs",
  "crates/lumen-index/src/persistence/infrastructure/segment_rdb_store/generation_validation.rs",
]
subject = "index.infrastructure"
reason = "The segment store walks the checkpoint directory the Engine wrote: the catalog decodes each collection directory's name with collection_name_from_dir, and compaction, the flat layout and the generation validation read a collection's sidecar with CheckpointLayout::from_sidecar to find a field's segment stem. P2: the checkpoint-directory port in the index domain (see the index application->infrastructure exception on checkpoint_flush above) names the layout and the directories, and persistence reads them through index's application layer."

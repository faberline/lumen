[package]
name = "lumen"
# lumen owns its version and releases independently (see CONTRIBUTING.md
# "Releasing").
version = "0.6.1"
edition = "2021"
authors = ["Chris Cheng <chris.cheng.c4@gmail.com>"]
license = "MIT"
repository = "https://github.com/faberline/lumen"
description = "lumen — standalone search and duplicate-detection index. Generic Collection / Field primitive, HTTP/2, sharded Raft."

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
byteorder = "1.5"
# On-disk snapshots: CBOR (self-describing binary) + lz4, replacing serde_json.
# Self-describing is required because the persisted types reuse the wire types,
# which use `skip_serializing_if` / untagged / internally-tagged serde — none of
# which a non-self-describing codec (bincode/postcard) can round-trip.
ciborium = "0.2"
bytemuck = { version = "1", features = ["derive"] }
roaring = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "string", "env"] }
crc32fast = "1.4"
sha2 = "0.10"
futures = "0.3"
# Shared h2c client for the Lumen-owned raft WAL and online CLI ops. The serving
# binary links it only when a feature that needs outbound HTTP is enabled.
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "system-proxy", "rustls-tls-native-roots", "json", "cookies", "gzip", "brotli", "multipart", "stream"], optional = true }
# Shared h2c transport: `server` powers `serve` (HTTP/1.1 + h2c on one port via
# hyper auto-builder, replacing the HTTP/1-only `axum::serve`).
transport-h2c = { git = "https://github.com/faberline/core", tag = "v0.4.13", features = ["server"] }
# `lumen upgrade` / `lumen issue` — the standard agent-facing CLI ops,
# shared across the ecosystem (CONTRIBUTING.md "CLI convention"). Offline paths
# always build; the HTTPS paths are pulled in by lumen's `self-update` /
# `issue` features via `cli-std/online`. `k8s` pulls in `cli_std::connect`
# (#1376) — `lumen connect`'s port-forward lifecycle + token-registry Secret
# resolution, always built (not behind a lumen feature flag).
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.13", default-features = false, features = ["k8s"] }
# Shared request-auth plumbing. Lumen holds no credentials: `service_auth::k8s`
# delegates authentication to TokenReview and authorization to
# SubjectAccessReview, and Lumen supplies only the mapping from its own
# operations onto Kubernetes resource attributes (#2869).
service-auth = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# Shared k8s-native HTTP service shell: standard probe routes, request tracing,
# h2c serve wrapper, and SIGTERM drain sequencing.
service-http = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# One absolute shutdown deadline shared by Lumen's public HTTP drain and its
# Raft host. The serving binary consumes it directly during SIGINT/SIGTERM.
server-lifecycle = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# Shared backup destination/policy/sink/runner contract. Lumen still owns
# producing a consistent engine snapshot; this lib owns where/how bytes are kept.
service-backup = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# Shared durable local storage primitives: fsync policy, atomic snapshot replace,
# and CRC-framed append logs. Lumen owns the domain codecs layered on top.
storage-durable = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# Shared analyzer and rebuildable text-index core. Lumen keeps its collection,
# routing, scoring, and distributed state above this product-neutral base.
index-text = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# Lumen-owned HA: writes replicated through the shared raft-core engine (behind
# the `raft-wal` feature). Peer RPCs ride the same h2c transport.
raft-core = { git = "https://github.com/faberline/core", tag = "v0.4.13", optional = true }
# Non-optional (#1002): `src/config.rs`/`src/raft.rs` delegate the StatefulSet
# shard/replica/voter math + peer-DNS/`LUMEN_PEERS` override parsing to
# `raft_runtime::cluster` unconditionally (those modules compile with no
# feature), so the actual raft engine and lumen's serving-side topology
# surface can't fork the derivation. Adds no new crate to the default build:
# every transitive dep it pulls in (raft-core, h2c, axum, tokio, reqwest via
# h2c) is already unconditional in this graph; only `raft-wal` still gates the
# replication engine (raft-core) + peer-RPC HTTP client (reqwest) themselves.
raft-runtime = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# `lumen spec gen` — generate a typed client from lumen's own OpenAPI.
openapi-codegen = { git = "https://github.com/faberline/core", tag = "v0.4.13", version = "0.5" }
rayon = "1.10"
# simdeez_f compiles anndists' SIMD distance kernels (aarch64 NEON `asimd`,
# x86 AVX2/SSE2) for DistL2/DistDot. The cosine path routes through DistDot on
# internally unit-normalized vectors to use the NEON kernel (DistCosine has no
# SIMD path and recomputes both operand norms per comparison).
hnsw_rs = { version = "0.3", features = ["simdeez_f"] }
self_cell = "=1.2.2"
jieba-rs = { version = "=0.7.4", optional = true }
# K8s Operator (feature `operator`).
kube = { version = "0.98", features = ["runtime", "derive", "client"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_32"], optional = true }
schemars = { version = "0.8", optional = true }
# Shared operator scaffolding (reconcile loop + leader-election lease); lumen
# supplies the `Lumen` CRD + render and composes the rest (epic #580).
service-k8s = { git = "https://github.com/faberline/core", tag = "v0.4.13", default-features = false, features = ["render-only"] }
serde_yaml = "0.9"
lz4_flex = "0.11"
memmap2 = "0.9"
# Private bounded spools retain generic committed replacement values on disk.
tempfile = "3"
# Query destination filesystem path limits before allocating peer archive metadata.
libc = "0.2"
moka = { version = "0.12", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_path_to_error = "0.1"
rustc-hash = "2.1"
# Types only — `ServerConfig` / `ClientConfig` appear in `tls.rs`'s signatures.
# Every builder, PEM loader, and client verifier lives in `libs/peer-tls`
# (#2890 R6), which is why there is no `rustls-pemfile` here to parse anything
# locally.
rustls = "0.23"
# Shared peer-mTLS material loading (PEM cert/key/CA + rustls builders +
# crypto-provider install); lumen keeps a thin adapter with its
# `LUMEN_PEER_TLS_*`/`LUMEN_PEER_MTLS` env names (#971).
peer-tls = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# Shared lock-free counter/gauge/latency primitives + Prometheus text
# encoder; lumen's `Metrics` reimplements on top with byte-identical
# `render()` output (#974).
metrics-prometheus = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
smallvec = "1"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# OpenTelemetry metrics (feature `otel`): service-http owns trace export;
# Lumen retains only the observable engine-counter metrics exporter.
opentelemetry = { version = "0.21", optional = true }
opentelemetry-otlp = { version = "0.14", features = ["tonic", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"], optional = true }
utoipa = { version = "4", features = ["axum_extras"] }

[build-dependencies]
build-stamp = { git = "https://github.com/faberline/core", tag = "v0.4.13" }

[features]
default = []
jieba = ["dep:jieba-rs", "index-text/jieba"]
# raft-wal — lumen owns write ordering + replication via libs/raft-core (HA),
# instead of an external broker. Peer RPCs use the h2c client. (#515)
# raft-runtime itself is non-optional (#1002; see the dependency comment above) —
# only the engine (raft-core) and its peer-RPC HTTP client (reqwest) are
# feature-gated here.
raft-wal = ["dep:raft-core", "dep:reqwest"]
# backup — `lumen backup` (#808): fetches a snapshot from a running fleet's
# `/admin/backup` over HTTP and hands it to a `libs/service-backup`
# destination sink. When linked, that shared sink can now speak local files or
# S3-compatible object stores; Lumen still owns no upload client of its own.
backup = ["dep:reqwest", "service-backup/http-client", "service-backup/s3"]
# self-update / issue — enable the online (HTTPS) paths of the shared
# CLI-ops lib. Offline builds still ship both commands (upgrade --check / the
# issue create dry-run + pre-filled-URL fallback). The published binary enables
# them (lumen-release.yml); both map to the lib's single `online` capability.
self-update = ["cli-std/online"]
issue = ["cli-std/online"]
# Deprecated build-feature alias kept for release scripts or local invocations
# that have not yet renamed their feature set. The CLI command itself is
# `lumen issue`, not `lumen report-issue`.
report-issue = ["issue"]
operator = ["dep:kube", "dep:k8s-openapi", "dep:schemars", "service-k8s/full", "backup"]
# delegated-auth — the live TokenReview/SubjectAccessReview transport for
# `LUMEN_AUTH=required` (#2869). Separate from `operator` on purpose: serving
# auth is not a control-plane concern, and a serving binary should not have to
# link the CRD/controller stack to authenticate its callers. The whole decision
# path (audience binding, ServiceAccount-only admission, the resource mapping,
# the fail-closed outage arm) compiles and is tested without this feature; only
# the socket is behind it, so a build that omits it refuses to start under
# `LUMEN_AUTH=required` rather than serving with authentication it cannot do.
#
# It carries `reqwest` because `lumen connect --ca-file` verifies the fleet's
# serving certificate through the same client the loopback proxy forwards with
# (#3113 R6); that client is only reachable on this path, which is also the only
# path that can mint the token it carries.
delegated-auth = ["service-auth/k8s", "dep:reqwest"]
# OTLP domain metrics plus service-http's shared trace exporter. Runtime export
# remains dormant unless LUMEN_OTLP_ENDPOINT is set.
otel = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "service-http/otlp"]
# Canonical feature set compiled for published binaries and release containers.
release = [
    "otel",
    "operator",
    "raft-wal",
    "self-update",
    "issue",
    "delegated-auth",
]

[dev-dependencies]
axum-test = "17"
# The on-disk snapshot is CBOR, and CBOR is the ROLLBACK path — a 0.4.30 node
# writes `rdb.rs`'s data directory, the operator rolls back to 0.4.29, and that
# build decodes it. `tests/it/snapshot_ships_only_the_forward_column.rs` reads the
# encoded bytes with the same decoder 0.4.29 uses, so the compat claim is
# measured on the format that actually carries it rather than only on JSON.
ciborium = "0.2"
criterion = "0.5"
proptest = "1"
rand = "0.8"
rig = { git = "https://github.com/faberline/rig", rev = "1fbe487eb4a94d745447227dbc974c3eb3e9fbd5" }
serde_json = { version = "1.0", features = ["preserve_order"] }
# Shared observability layer: JSON formatter + service-identity for subscriber-capture tests.
service-observability = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter", "registry"] }
# HTTP client for the perf-gate / write-qps harness (drives lumen + OpenSearch).
# DEV-ONLY on purpose: the serving binary speaks REST/OpenAPI and ships no Rust
# client SDK, so it never links an HTTP client → no openssl → clean cross-compile.
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "system-proxy", "rustls-tls-native-roots", "json", "cookies", "gzip", "brotli", "multipart", "stream"] }
# Native pg driver for the competitive perf gate (tests/it/perf_gate.rs). Postgres
# is driven over its own wire protocol so the lumen-vs-pg end-to-end comparison
# is honest.
tokio-postgres = "0.7"
toml = "0.8"
# Stage 2 Phase 2i scale proof (tests/disk_scale_proof.rs). `memory-stats` reads
# cross-platform PHYSICAL resident set size (macOS task_info, Linux /proc/self/statm)
# so the disk-engine's bounded-RSS claim is measured, not asserted. `libc` exposes
# getrusage(RUSAGE_SELF) for ru_majflt/ru_minflt — the demand-paging (major page
# fault) evidence. libc is already a transitive dep; naming it here is a no-op on
# the lockfile. Both are test-only.
memory-stats = "1"
# Mock HTTP server for the `backup` feature's unit tests (stands in for the
# admin API's `/admin/backup`).
wiremock = "0.6"
# Mints the projected ServiceAccount tokens the control-plane identity tests
# rotate, expire, and mis-audience (#2877). Real JWTs, not stand-in strings:
# `ProjectedTokenFile` inspects the claims, so a fixture that is not a token
# would only ever exercise the malformed branch.
jsonwebtoken = "9"
# Mints the throwaway CA + leaf certificates the peer-mTLS tests dial with
# (#2890). Real X.509 material, not fixtures: the negative cases turn on chain
# validation and SAN matching, which a hand-written PEM constant cannot vary.
rcgen = "0.13"

[[bench]]
name = "bench_index"
harness = false

[[bench]]
name = "bench_search"
harness = false

[[bench]]
name = "bench_duplicates"
harness = false

# Integration tests are one binary, `tests/it/`. Each other `tests/<name>.rs`
# is its own binary because it changes process-global state or measures the
# whole process; its header says which. Only a feature requirement needs a
# stanza here.
[[test]]
name = "body_limit_configurable"
required-features = ["operator"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

# Preserve jieba-rs 0.7.4 cuts while allowing Lumen to store the no-HMM route on disk.
[patch.crates-io]
jieba-rs = { path = "vendor/jieba-rs" }
